<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project-X 离线演示</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="text-slate-800">
  <div id="gatePage" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
    <div class="glass rounded-2xl shadow-2xl p-8 w-full max-w-lg border border-white/50">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center text-white text-2xl font-bold shadow-lg">X</div>
        <h1 class="text-2xl font-bold">Project-X 离线演示</h1>
        <p class="text-slate-500 text-sm mt-2">纯静态页面 · 内置完整测试数据集 · 无需后端</p>
        <span class="inline-block mt-3 api-badge api-demo">演示模式（无后端）</span>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-4">
        <button type="button" id="btnTeacher" class="role-btn p-4 rounded-xl border-2 border-slate-200 hover:border-blue-500 transition text-center">
          <div class="text-3xl mb-2">👨‍🏫</div>
          <div class="font-medium">教师端</div>
        </button>
        <button type="button" id="btnStudent" class="role-btn p-4 rounded-xl border-2 border-slate-200 hover:border-blue-500 transition text-center">
          <div class="text-3xl mb-2">👨‍🎓</div>
          <div class="font-medium">学生端</div>
        </button>
      </div>
      <div id="studentPicker" class="hidden mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">选择演示学生</label>
        <select id="studentSelect" class="w-full px-3 py-2 rounded-lg border border-slate-300"></select>
      </div>
      <button type="button" id="enterBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg shadow-lg shadow-blue-600/30 disabled:opacity-50" disabled>
        进入演示
      </button>
      <p class="text-xs text-slate-400 text-center mt-4">从主站登录页使用账号 <code class="text-slate-600">offline-demo</code> 可直达此页</p>
      <a href="/" class="block text-center text-sm text-blue-600 hover:underline mt-3">返回主站登录</a>
    </div>
  </div>

  <div id="appPage" class="hidden min-h-screen flex">
    <aside class="sidebar w-64 bg-white border-r border-slate-200 flex flex-col fixed h-full z-10">
      <div class="p-5 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">X</div>
          <div>
            <div class="font-bold text-sm">离线演示</div>
            <div id="userRoleLabel" class="text-xs text-slate-500"></div>
          </div>
        </div>
        <div id="userName" class="text-sm font-medium mt-3"></div>
      </div>
      <nav id="sidebarNav" class="flex-1 py-2 overflow-y-auto"></nav>
      <div class="p-4 border-t border-slate-100 space-y-2">
        <a href="/" class="block text-center text-xs text-slate-500 hover:text-blue-600">返回主站</a>
        <button type="button" id="logoutBtn" class="w-full text-sm text-slate-600 hover:text-red-600 py-1">退出演示</button>
      </div>
    </aside>

    <div class="flex-1 ml-64 min-h-screen flex flex-col">
      <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between sticky top-0 z-20">
        <h2 id="pageTitle" class="text-xl font-bold text-slate-800">数据概览</h2>
        <span class="api-badge api-demo">纯静态 · 离线数据</span>
      </header>
      <main id="mainContent" class="flex-1 p-8 bg-slate-50 overflow-auto"></main>
    </div>
    <nav id="mobileTabBar" class="mobile-tab-bar"></nav>
  </div>

  <script src="./app.js"></script>
</body>
</html>

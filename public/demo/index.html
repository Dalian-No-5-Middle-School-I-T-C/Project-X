<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project-X 离线演示</title>
  <meta http-equiv="refresh" content="0;url=/" />
  <style>
    :root {
      --brand: #C00F28;
      --background: #F2F2F7;
      --text: #0F0F0F;
      --muted: #8A8A8A;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(192, 15, 40, 0.08) 0%, transparent 42%),
        radial-gradient(ellipse at 80% 70%, rgba(0, 0, 0, 0.04) 0%, transparent 46%),
        var(--background);
      color: var(--text);
    }
    .card {
      width: min(420px, calc(100% - 32px));
      padding: 28px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(24px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon {
      width: 48px; height: 48px; margin: 0 auto 14px;
      border-radius: 12px;
      display: grid; place-items: center;
      color: #fff; font-weight: 700;
      background: linear-gradient(135deg, #E8354A, #C00F28 58%, #9A0B21);
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 40px; padding: 0 18px; border-radius: 10px;
      background: linear-gradient(180deg, #E8354A, #C00F28);
      color: #fff; text-decoration: none; font-weight: 600; font-size: 14px;
    }
    code { background: rgba(0,0,0,0.05); padding: 1px 6px; border-radius: 4px; }
  </style>
  <script>
    // Prefer same-origin SPA login. If opened from a standalone static server
    // (e.g. :8765 serving only /demo), fall back to the Vite/dev origin.
    (function () {
      var target = "/";
      try {
        if (location.port === "8765" || /\/demo\/?$/.test(location.pathname) && !document.querySelector('script[src*="main"]')) {
          // Keep "/" when reverse-proxied under the main app; otherwise try 5173.
          if (location.port === "8765") target = "http://127.0.0.1:5173/";
        }
      } catch (e) {}
      location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">X</div>
    <h1>离线演示已并入主应用</h1>
    <p>
      请使用主站登录页账号 <code>offline-demo</code> / <code>offline-demo</code> 进入，
      界面与操作逻辑与正式系统一致，仅使用内置测试数据。
    </p>
    <a id="goLogin" href="/">返回主站登录</a>
  </div>
  <script>
    if (location.port === "8765") {
      document.getElementById("goLogin").href = "http://127.0.0.1:5173/";
    }
  </script>
</body>
</html>

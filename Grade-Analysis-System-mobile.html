<script>
// ==================== 全局配置 ====================
const urlParams = new URLSearchParams(location.search);
const API_BASE = (urlParams.get('api_base') || urlParams.get('apiBase') || '').replace(/\/$/, '');
let apiMode = urlParams.get('demo') === '1' ? 'demo' : 'live';
let authToken = urlParams.get('token') || localStorage.getItem('px_token') || null;
let currentUser = null;
let currentRole = null;
let currentStudent = null;
let appData = { exams: [], students: [], scores: [], classes: [] };
let charts = {};
let isWeixinWebView = false;
let studentCache = new Map();
try { if (window.__wxjs_environment === 'miniprogram' || /miniProgram/.test(navigator.userAgent)) { isWeixinWebView = true; } } catch(e) {}

// ==================== HTTP 工具 ====================
async function apiGet(path) {
  if (apiMode === 'demo') throw new Error('DEMO_MODE');
  const headers = authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
  const res = await fetch(API_BASE + path, { headers });
  if (!res.ok) {
    if (res.status === 401) { alert('登录已过期，请重新登录'); logout(); }
    throw new Error('HTTP ' + res.status);
  }
  return res.json();
}

async function apiPost(path, body) {
  if (apiMode === 'demo') throw new Error('DEMO_MODE');
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(authToken ? { 'Authorization': 'Bearer ' + authToken } : {}) },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    if (res.status === 401) { alert('登录已过期，请重新登录'); logout(); }
    throw new Error('HTTP ' + res.status);
  }
  return res.json();
}

// ==================== 后端 API 映射（与 Project-X 实际接口对齐）====================
// 实际后端接口：
// GET  /api/exams              → 考试列表
// GET  /api/exams/:id          → 考试详情+成绩
// GET  /api/analysis/exams/:id/overview   → 考试总览统计
// GET  /api/analysis/exams/:id/students   → 学生排名
// GET  /api/analysis/exams/:id/questions  → 题目得分率
// POST /api/auth/login         → 登录
// GET  /api/auth/me            → 当前用户信息
const API = {
  login: (u, p) => apiPost('/api/auth/login', { identifier: u, password: p }),
  me: () => apiGet('/api/auth/me'),
  getExams: () => apiGet('/api/exams'),
  getExam: (id) => apiGet('/api/exams/' + id),
  getOverview: (id, cls) => apiGet('/api/analysis/exams/' + id + '/overview' + (cls ? '?classId=' + cls : '')),
  getStudents: (id, cls) => apiGet('/api/analysis/exams/' + id + '/students' + (cls ? '?classId=' + cls : '')),
  getQuestions: (id, cls) => apiGet('/api/analysis/exams/' + id + '/questions' + (cls ? '?classId=' + cls : '')),
  getClasses: (id) => apiGet('/api/analysis/exams/' + id + '/classes'),
  getAllClasses: () => apiGet('/api/classes'),
  getClassStudents: (id) => apiGet('/api/classes/' + id + '/students')
};

// ==================== 演示数据生成器 ====================
function generateDemoData() {
  const subjects = [{name:'语文',maxScore:150},{name:'数学',maxScore:150},{name:'英语',maxScore:150},{name:'物理',maxScore:100},{name:'化学',maxScore:100},{name:'生物',maxScore:100}];
  const classNames = ['高一(1)班','高一(2)班','高一(3)班','高一(4)班'];
  const examNames = ['第一次月考','期中考试','第二次月考','期末考试'];

  appData.exams = examNames.map((name, i) => ({
    id: 'exam_' + i, name: name,
    date: '2025-' + (9 + Math.floor(i/2)) + '-' + (15 + (i%2)*15),
    subjects: subjects
  }));
  appData.classes = classNames;

  const lastNames = ['赵','钱','孙','李','周','吴','郑','王','冯','陈','褚','卫','蒋','沈','韩','杨'];
  const firstNames = ['伟','芳','娜','敏','静','丽','强','磊','军','洋','勇','艳','杰','娟','涛','明'];

  appData.students = [];
  let sid = 0;
  classNames.forEach((cls, ci) => {
    for (let i = 0; i < 15; i++) {
      const name = lastNames[Math.floor(Math.random()*lastNames.length)] + firstNames[Math.floor(Math.random()*firstNames.length)] + (Math.random()>0.5?firstNames[Math.floor(Math.random()*firstNames.length)]:'');
      appData.students.push({ id:'stu_'+sid, name:name, className:cls, studentNo:'2025'+String(ci+1).padStart(2,'0')+String(i+1).padStart(2,'0') });
      sid++;
    }
  });

  appData.scores = [];
  appData.students.forEach(stu => {
    const base = {};
    subjects.forEach(s => { base[s.name] = s.maxScore * 0.4 + Math.random() * s.maxScore * 0.5; });
    appData.exams.forEach((exam, ei) => {
      const subScores = {}; let total = 0;
      subjects.forEach(s => {
        const trend = ei * (Math.random()*6-2);
        const noise = (Math.random()-0.5)*20;
        let sc = Math.round(base[s.name] + trend + noise);
        sc = Math.max(0, Math.min(s.maxScore, sc));
        subScores[s.name] = sc; total += sc;
      });
      appData.scores.push({ studentId:stu.id, examId:exam.id, subjectScores:subScores, totalScore:total });
    });
  });
  apiMode = 'demo';
  updateApiIndicator();
}

// ==================== 数据访问层（统一封装，自动切换 live/demo）====================
// 从考试详情中提取成绩数据
async function fetchExamWithScores(examId) {
  if (apiMode === 'demo') {
    const exam = appData.exams.find(e => e.id === examId);
    const scores = appData.scores.filter(s => s.examId === examId);
    return { exam, scores };
  }
  const examRaw = await API.getExam(examId);
  const results = examRaw.results || [];
  const scores = results.map(r => ({
    studentId: r.student_id,
    studentNo: r.student_number,
    name: r.name,
    totalScore: r.total_score,
    subjectScores: {
      '客观题': r.objective_score || 0,
      '主观题': r.subjective_score || 0
    }
  }));
  for (const r of results) {
    if (r.student_number) {
      studentCache.set(r.student_number, { id: r.student_id, name: r.name, className: studentCache.get(r.student_number)?.className || '' });
    }
  }
  return { exam: examRaw, scores };
}

async function fetchExams() {
  if (apiMode === 'demo') return appData.exams;
  const exams = await API.getExams();
  return exams.map(e => ({
    id: String(e.id),
    name: e.name || '未命名考试',
    date: e.start_time || e.created_at || '',
    subjects: [
      { name: '客观题', maxScore: 100 },
      { name: '主观题', maxScore: 100 }
    ],
    _raw: e
  }));
}

async function fetchOverview(examId) {
  if (apiMode === 'demo') {
    const scores = appData.scores.filter(s => s.examId === examId);
    const exam = appData.exams.find(e => e.id === examId);
    const subjects = exam.subjects.map(s => s.name);
    const subjectAvgs = {};
    subjects.forEach(sub => {
      const sum = scores.reduce((acc, s) => acc + s.subjectScores[sub], 0);
      subjectAvgs[sub] = scores.length ? Math.round(sum / scores.length * 10) / 10 : 0;
    });
    const totalSum = scores.reduce((acc, s) => acc + s.totalScore, 0);
    return {
      totalAvg: scores.length ? Math.round(totalSum / scores.length * 10) / 10 : 0,
      maxScore: scores.length ? Math.max(...scores.map(s => s.totalScore)) : 0,
      minScore: scores.length ? Math.min(...scores.map(s => s.totalScore)) : 0,
      count: scores.length,
      subjectAvgs: subjectAvgs,
      distribution: {
        excellent: scores.filter(s => s.totalScore >= 720).length,
        good: scores.filter(s => s.totalScore >= 600 && s.totalScore < 720).length,
        pass: scores.filter(s => s.totalScore >= 450 && s.totalScore < 600).length,
        fail: scores.filter(s => s.totalScore < 450).length
      }
    };
  }
  const ov = await API.getOverview(examId);
  const dist = { excellent: 0, good: 0, pass: 0, fail: 0 };
  if (ov.distribution && Array.isArray(ov.distribution)) {
    for (const d of ov.distribution) {
      if (d.range === '90-100') dist.excellent = d.count;
      else if (d.range === '80-89') dist.good = d.count;
      else if (['70-79','60-69'].includes(d.range)) dist.pass += d.count;
      else if (d.range === '0-59') dist.fail = d.count;
    }
  }
  return {
    totalAvg: ov.avgScore ?? 0,
    maxScore: ov.maxScore ?? 0,
    minScore: ov.minScore ?? 0,
    count: ov.totalStudents ?? ov.gradedCount ?? 0,
    subjectAvgs: { '客观题': 0, '主观题': 0 },
    distribution: dist,
    _raw: ov
  };
}

async function fetchStudentRankings(examId) {
  if (apiMode === 'demo') {
    const scores = appData.scores.filter(s => s.examId === examId);
    const ranked = scores.map(s => {
      const stu = appData.students.find(st => st.id === s.studentId);
      return { ...s, ...stu };
    }).sort((a, b) => b.totalScore - a.totalScore);
    ranked.forEach((item, idx) => { item.rank = idx + 1; });
    return ranked;
  }
  const rows = await API.getStudents(examId);
  return rows.map(r => {
    const cache = studentCache.get(r.studentNumber) || {};
    return {
      rank: r.rank,
      studentId: cache.id || r.studentNumber,
      name: r.studentName || r.name,
      studentName: r.studentName || r.name,
      studentNo: r.studentNumber,
      className: cache.className || '',
      totalScore: r.totalScore,
      subjectScores: {
        '客观题': r.objectiveScore,
        '主观题': r.subjectiveScore
      },
      objectiveScore: r.objectiveScore,
      subjectiveScore: r.subjectiveScore,
      needReview: r.needReview
    };
  });
}

async function fetchClassStats(examId) {
  if (apiMode === 'demo') {
    const exam = appData.exams.find(e => e.id === examId);
    const subjects = exam.subjects.map(s => s.name);
    return appData.classes.map(cls => {
      const stuIds = appData.students.filter(st => st.className === cls).map(st => st.id);
      const scores = appData.scores.filter(s => s.examId === examId && stuIds.includes(s.studentId));
      const subjectAvgs = {};
      subjects.forEach(sub => {
        const sum = scores.reduce((acc, s) => acc + s.subjectScores[sub], 0);
        subjectAvgs[sub] = scores.length ? Math.round(sum / scores.length * 10) / 10 : 0;
      });
      const totalSum = scores.reduce((acc, s) => acc + s.totalScore, 0);
      return {
        className: cls,
        count: scores.length,
        totalAvg: scores.length ? Math.round(totalSum / scores.length * 10) / 10 : 0,
        subjectAvgs: subjectAvgs,
        maxScore: scores.length ? Math.max(...scores.map(s => s.totalScore)) : 0,
        minScore: scores.length ? Math.min(...scores.map(s => s.totalScore)) : 0
      };
    });
  }
  const classList = await API.getClasses(examId);
  const exams = await fetchExams();
  const exam = exams.find(e => e.id === examId);
  const subjects = exam ? exam.subjects.map(s => s.name) : [];
  const stats = [];
  for (const cls of classList) {
    try {
      const ov = await API.getOverview(examId, cls.classId);
      const rank = await API.getStudents(examId, cls.classId);
      const subjectAvgs = {};
      subjects.forEach(sub => { subjectAvgs[sub] = 0; });
      if (rank.length > 0) {
        const objSum = rank.reduce((a, r) => a + (r.objectiveScore || 0), 0);
        const subjSum = rank.reduce((a, r) => a + (r.subjectiveScore || 0), 0);
        subjectAvgs['客观题'] = Math.round(objSum / rank.length * 10) / 10;
        subjectAvgs['主观题'] = Math.round(subjSum / rank.length * 10) / 10;
      }
      const scores = rank.map(r => r.totalScore);
      stats.push({
        className: cls.className,
        count: ov.gradedCount || rank.length,
        totalAvg: ov.avgScore || 0,
        subjectAvgs: subjectAvgs,
        maxScore: scores.length ? Math.max(...scores) : 0,
        minScore: scores.length ? Math.min(...scores) : 0
      });
    } catch (e) {
      console.warn('[ClassStats] 班级', cls.className, '加载失败:', e);
    }
  }
  return stats;
}

async function fetchStudentScores(studentId) {
  if (apiMode === 'demo') {
    return appData.scores.filter(s => s.studentId === studentId).sort((a, b) => {
      const idxA = appData.exams.findIndex(e => e.id === a.examId);
      const idxB = appData.exams.findIndex(e => e.id === b.examId);
      return idxA - idxB;
    });
  }
  if (currentRole === 'student') {
    try {
      const res = await apiGet('/api/scores/me');
      const raw = res.scores || [];
      const exams = await fetchExams();
      return raw.map(s => ({
        examId: String(s.examId || s.exam_id),
        studentId: studentId,
        totalScore: s.totalScore || s.total_score || 0,
        subjectScores: {
          '客观题': s.objectiveScore || s.objective_score || 0,
          '主观题': s.subjectiveScore || s.subjective_score || 0
        }
      })).filter(s => s.examId);
    } catch (e) { console.warn('[Scores] /api/scores/me 失败，回退到逐考试查询:', e); }
  }
  const exams = await fetchExams();
  const scores = [];
  for (const exam of exams) {
    try {
      const detail = await fetchExamWithScores(exam.id);
      const score = detail.scores.find(s => String(s.studentId) === String(studentId) || String(s.studentNo) === String(studentId));
      if (score) scores.push({ ...score, examId: exam.id });
    } catch (e) {}
  }
  return scores;
}

async function fetchRankings(examId, scope, studentId) {
  if (apiMode === 'demo') {
    const student = appData.students.find(s => s.id === studentId);
    let scores = appData.scores.filter(s => s.examId === examId);
    if (scope === 'class') {
      const stuIds = appData.students.filter(st => st.className === student.className).map(st => st.id);
      scores = scores.filter(s => stuIds.includes(s.studentId));
    }
    scores.sort((a, b) => b.totalScore - a.totalScore);
    const rank = scores.findIndex(s => s.studentId === studentId) + 1;
    return { rank, total: scores.length };
  }
  const me = currentStudent || (await API.me());
  const myClassName = me.className || (studentCache.get(me.student_number || me.studentNo)?.className) || '';
  const all = await API.getStudents(examId);
  let filtered = all;
  if (scope === 'class' && myClassName) {
    const classNums = new Set();
    for (const [num, info] of studentCache.entries()) {
      if (info.className === myClassName) classNums.add(num);
    }
    filtered = all.filter(s => classNums.has(s.studentNumber));
  }
  filtered.sort((a, b) => b.totalScore - a.totalScore);
  const myNum = me.student_number || me.studentNo || String(studentId);
  const idx = filtered.findIndex(s => s.studentNumber === myNum);
  if (idx === -1 && scope === 'class') return { rank: '-', total: filtered.length };
  return { rank: idx >= 0 ? idx + 1 : '-', total: filtered.length };
}

async function handleLogin() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  if (!username) { alert('请输入用户名'); return; }

  if (apiMode === 'live') {
    try {
      const res = await API.login(username, password);
      authToken = res.token;
      if (res.token) localStorage.setItem('px_token', res.token);
      const me = await API.me();
      currentUser = me;
      currentRole = (me.role === 'student' || me.role_id === 3) ? 'student' : 'teacher';
      if (currentRole === 'student') {
        currentStudent = { id: me.id, name: me.name, studentNo: me.student_number, className: '' };
      }
      await loadStudentCache();
    } catch (e) {
      alert('登录失败: ' + e.message + '\n请检查后端是否运行，或点击演示数据体验。');
      return;
    }
  } else {
    if (currentRole === 'student') {
      currentStudent = appData.students[0];
      currentUser = { name: currentStudent.name, role: 'student', id: currentStudent.id, className: currentStudent.className };
    } else {
      currentUser = { name: username || '教师', role: 'teacher', id: 'teacher_1' };
    }
  }

  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userRole').textContent = currentRole === 'teacher' ? '教师端' : '学生端';
  document.getElementById('userAvatar').textContent = currentUser.name ? currentUser.name[0] : 'U';
  updateApiIndicator();

  initSidebar(); initMobileTabBar();
  await initExamFilter();

  if (currentRole === 'teacher') showSection('teacherOverview');
  else showSection('studentDashboard');
}

async function loadStudentCache() {
  if (apiMode === 'demo') return;

    const classes = await API.getAllClasses();
    for (const cls of classes) {
      const students = await API.getClassStudents(cls.id);
      for (const stu of students) {
        if (stu.student_number) {
          studentCache.set(stu.student_number, { id: stu.id, className: cls.name, name: stu.name });

      }
    }
  } catch (e) { console.warn('[Cache] 加载班级缓存失败:', e); }
}

  });
}

  '</div>';

  document.getElementById('mainContent').innerHTML = html;

  const trend = [];
  for (const exam of exams) {
    const s = scores.find(sc => sc.examId === exam.id);
    const clsStats = await fetchClassStats(exam.id);
    const clsAvg = clsStats.find(c => c.className === stu.className);
    trend.push({
      exam: exam.name,
      myScore: s ? s.totalScore : 0,
      classAvg: clsAvg ? clsAvg.totalAvg : 0
    });
  }

  charts.studentTotal = new Chart(document.getElementById('studentTotalChart'), {
    type: 'bar',

    },
    options: { responsive: true, scales: { y: { beginAtZero: true } } }

      '<h3 class="font-bold text-slate-800 mb-4">各科成绩变化趋势</h3>' +
      '<canvas id="studentSubjectTrend" height="280"></canvas>' +
    '</div>' +
    '<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">' +
      '<div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">' +
        '<h3 class="font-bold text-slate-800 mb-4">总分变化趋势</h3>' +
        '<canvas id="studentTotalTrend" height="220"></canvas>' +
      '</div>' +
      '<div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">' +
        '<h3 class="font-bold text-slate-800 mb-4">排名变化趋势</h3>' +
        '<canvas id="studentRankTrend" height="220"></canvas>' +
      '</div>' +
    '</div>' +
  '</div>';

  document.getElementById('mainContent').innerHTML = html;

  const subjects = exams[0].subjects.map(s => s.name);
  const subDatasets = subjects.map((sub, idx) => {
    const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
    return {
      label: sub,
      data: scores.map(s => s.subjectScores[sub]),
      borderColor: colors[idx % colors.length],
      backgroundColor: colors[idx % colors.length] + '10',
      fill: true,
      tension: 0.4,
      pointRadius: 5
    };
  });

  charts.subTrend = new Chart(document.getElementById('studentSubjectTrend'), {
    type: 'line',
    data: {
      labels: scores.map(s => exams.find(e => e.id === s.examId).name),
      datasets: subDatasets
    },
    options: { responsive: true, interaction: { mode: 'index', intersect: false }, scales: { y: { beginAtZero: true, max: 160 } } }
  });

  charts.totalTrend = new Chart(document.getElementById('studentTotalTrend'), {
    type: 'line',
    data: {
      labels: scores.map(s => exams.find(e => e.id === s.examId).name),
      datasets: [{
        label: '总分',
        data: scores.map(s => s.totalScore),
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.1)',
        fill: true,
        tension: 0.4,
        pointRadius: 6
      }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true } } }
  });

  const rankData = [];
  for (const s of scores) {
    const r = await fetchRankings(s.examId, 'grade', stu.id);
    rankData.push(r.rank);
  }

  charts.rankTrend = new Chart(document.getElementById('studentRankTrend'), {
    type: 'line',
    data: {
      labels: scores.map(s => exams.find(e => e.id === s.examId).name),
      datasets: [{
        label: '年级排名',
        data: rankData,
        borderColor: '#8b5cf6',
        backgroundColor: 'rgba(139,92,246,0.1)',
        fill: true,
        tension: 0.4,
        pointRadius: 6
      }]
    },
    options: { responsive: true, scales: { y: { reverse: true, beginAtZero: false } } }
  });
}

async function renderStudentAnalysis() {
  const stu = currentStudent;
  const scores = await fetchStudentScores(stu.id);
  const exams = await fetchExams();
  const latestExam = exams[exams.length - 1];
  const latestScore = scores.find(s => s.examId === latestExam.id);
  const classStats = await fetchClassStats(latestExam.id);
  const classAvg = classStats.find(c => c.className === stu.className);

  document.getElementById('pageTitle').textContent = '成绩分析';

  const subjects = latestExam.subjects;
  let strongSubjects = [];
  let weakSubjects = [];
  let improvedSubjects = [];
  let declinedSubjects = [];

  for (const s of subjects) {
    const current = latestScore.subjectScores[s.name];
    const classMean = classAvg ? classAvg.subjectAvgs[s.name] : 0;
    if (current >= classMean + 10) strongSubjects.push(s.name);
    else if (current <= classMean - 10) weakSubjects.push(s.name);

    if (scores.length >= 2) {
      const prev = scores[scores.length - 2].subjectScores[s.name];
      const change = current - prev;
      if (change >= 8) improvedSubjects.push({name: s.name, change: change});
      else if (change <= -8) declinedSubjects.push({name: s.name, change: change});
    }
  }

  let totalTrend = '稳定';
  let totalTrendColor = 'text-slate-600';
  if (scores.length >= 2) {
    const diff = scores[scores.length-1].totalScore - scores[scores.length-2].totalScore;
    if (diff > 20) { totalTrend = '显著进步'; totalTrendColor = 'text-emerald-600'; }
    else if (diff > 5) { totalTrend = '有所进步'; totalTrendColor = 'text-emerald-500'; }
    else if (diff < -20) { totalTrend = '明显退步'; totalTrendColor = 'text-red-600'; }
    else if (diff < -5) { totalTrend = '略有下滑'; totalTrendColor = 'text-amber-600'; }
  }

  let html = '<div class="max-w-4xl mx-auto space-y-6 fade-in">' +
    '<div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl p-6 text-white shadow-lg">' +
      '<h3 class="text-xl font-bold mb-2">' + stu.name + ' 的成绩诊断报告</h3>' +
      '<p class="text-indigo-100">基于 ' + exams.length + ' 次考试数据的' + (apiMode === 'live' ? '智能分析（后端数据）' : '演示分析') + '</p>' +
    '</div>' +
    '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">' +
      '<div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">' +
        '<h4 class="font-bold text-slate-800 mb-4 flex items-center gap-2">' +
          '<span class="w-6 h-6 rounded bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs">&#x2713;</span>' +
          '优势科目' +
        '</h4>' +
        (strongSubjects.length > 0 ?
          '<div class="space-y-2">' +
            strongSubjects.map(sub => {
              const score = latestScore.subjectScores[sub];
              const avg = classAvg ? classAvg.subjectAvgs[sub] : 0;
              return '<div class="flex items-center justify-between p-3 bg-emerald-50 rounded-lg">' +
                '<span class="font-medium text-emerald-800">' + sub + '</span>' +
                '<span class="text-sm text-emerald-600">' + score + '分 (超班均' + (score-avg).toFixed(1) + ')</span>' +
              '</div>';
            }).join('') +
          '</div>' +
          '<p class="text-sm text-slate-500 mt-3">这些科目是你的优势领域，建议保持现有学习方法。</p>'
          : '<p class="text-slate-500 text-sm">暂无显著优势科目，建议均衡发展。</p>') +
      '</div>' +
      '<div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">' +
        '<h4 class="font-bold text-slate-800 mb-4 flex items-center gap-2">' +
          '<span class="w-6 h-6 rounded bg-amber-100 text-amber-600 flex items-center justify-center text-xs">!</span>' +
          '薄弱科目' +
        '</h4>' +
        (weakSubjects.length > 0 ?
          '<div class="space-y-2">' +
            weakSubjects.map(sub => {
              const score = latestScore.subjectScores[sub];
              const avg = classAvg ? classAvg.subjectAvgs[sub] : 0;
              return '<div class="flex items-center justify-between p-3 bg-amber-50 rounded-lg">' +
                '<span class="font-medium text-amber-800">' + sub + '</span>' +
                '<span class="text-sm text-amber-600">' + score + '分 (低班均' + (avg-score).toFixed(1) + ')</span>' +
              '</div>';
            }).join('') +
          '</div>' +
          '<p class="text-sm text-slate-500 mt-3">建议增加这些科目的学习时间，针对性刷题。</p>'
          : '<p class="text-slate-500 text-sm">暂无显著薄弱科目，继续保持！</p>') +
      '</div>' +
    '</div>' +
    '<div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">' +
      '<h4 class="font-bold text-slate-800 mb-4">总体评价</h4>' +
      '<div class="prose text-slate-600 leading-relaxed">' +
        '<p>在最近的 <strong>' + latestExam.name + '</strong> 中，你的总分为 <strong>' + latestScore.totalScore + '</strong> 分，在班级中排名第 <strong>' + (await fetchRankings(latestExam.id, 'class', stu.id)).rank + '</strong>，在年级中排名第 <strong>' + (await fetchRankings(latestExam.id, 'grade', stu.id)).rank + '</strong>。</p>' +
        '<p class="mt-2">与班级平均分（' + (classAvg ? classAvg.totalAvg : '-') + '）相比，你' + (latestScore.totalScore > (classAvg ? classAvg.totalAvg : 0) ? '高于' : '低于') + '班级平均 <strong>' + Math.abs(latestScore.totalScore - (classAvg ? classAvg.totalAvg : 0)).toFixed(1) + '</strong> 分。</p>' +
        '<p class="mt-2">成绩总体趋势：<strong class="' + totalTrendColor + '">' + totalTrend + '</strong>。</p>' +
        (improvedSubjects.length > 0 ? '<p class="mt-2 text-emerald-600">&#x1F4C8; 进步明显的科目：' + improvedSubjects.map(s => s.name + '(+' + s.change + ')').join('、') + '，继续保持！</p>' : '') +
        (declinedSubjects.length > 0 ? '<p class="mt-2 text-amber-600">&#x1F4C9; 需要关注的科目：' + declinedSubjects.map(s => s.name + '(' + s.change + ')').join('、') + '，建议分析原因。</p>' : '') +
      '</div>' +
    '</div>' +
    '<div class="bg-blue-50 rounded-xl p-6 border border-blue-100">' +
      '<h4 class="font-bold text-blue-800 mb-3">&#x1F4A1; 个性化学习建议</h4>' +
      '<ul class="space-y-2 text-blue-700 text-sm">' +
        (weakSubjects.length > 0 ? '<li>&#x2022; 优先补习：' + weakSubjects.join('、') + '，建议每天额外安排30分钟专项练习。</li>' : '') +
        (strongSubjects.length > 0 ? '<li>&#x2022; 保持优势：' + strongSubjects.join('、') + '，可适当减少时间，用于攻克薄弱科目。</li>' : '') +
        '<li>&#x2022; 建立错题本，定期回顾 ' + subjects.map(s=>s.name).join('、') + ' 的易错知识点。</li>' +
        '<li>&#x2022; 关注考试心态调整，避免因紧张导致发挥失常。</li>' +
      '</ul>' +
    '</div>' +
  '</div>';

  document.getElementById('mainContent').innerHTML = html;
}

// ==================== 工具函数 ====================
function exportData() {
  const dataStr = JSON.stringify(appData, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'project-x-scores.json';
  a.click();
  URL.revokeObjectURL(url);
}

// 初始化
document.addEventListener('DOMContentLoaded', async () => {
  if (authToken && API_BASE) {
    try {
      const me = await API.me();
      currentUser = me;
      currentRole = (me.role === 'student' || me.role_id === 3) ? 'student' : 'teacher';
      if (currentRole === 'student') {
        currentStudent = { id: me.id, name: me.name, studentNo: me.student_number, className: '' };
      }
      await loadStudentCache();
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('appPage').classList.remove('hidden');
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userRole').textContent = currentRole === 'teacher' ? '教师端' : '学生端';
      document.getElementById('userAvatar').textContent = currentUser.name ? currentUser.name[0] : 'U';
      updateApiIndicator();
      initSidebar(); initMobileTabBar(); await initExamFilter();
      if (currentRole === 'teacher') showSection('teacherOverview');
      else showSection('studentDashboard');
      if (isWeixinWebView && window.wx && wx.miniProgram) {
        wx.miniProgram.postMessage({ data: { event: 'pageReady', role: currentRole } });
      }
      return;
    } catch (e) {
      console.warn('[Init] URL token 登录失败，回退到登录页:', e);
      authToken = null;
    }
  }
  checkApiHealth();
});
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project-X 成绩分析系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background: #f1f5f9; }
        .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
        .card { transition: all 0.3s ease; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-weight: 700; font-size: 0.85rem; }
        .rank-1 { background: #fef3c7; color: #b45309; }
        .rank-2 { background: #f3f4f6; color: #4b5563; }
        .rank-3 { background: #ffedd5; color: #9a3412; }
        .rank-other { background: #f8fafc; color: #64748b; }
        .subject-tag { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 500; }
        .trend-up { color: #059669; }
        .trend-down { color: #dc2626; }
        .sidebar-item { transition: all 0.2s; cursor: pointer; }
        .sidebar-item:hover, .sidebar-item.active { background: #eff6ff; color: #2563eb; border-right: 3px solid #2563eb; }
        .tab-btn { transition: all 0.2s; }
        .tab-btn.active { background: #2563eb; color: white; }
        .hidden-section { display: none; }
        .visible-section { display: block; animation: fadeIn 0.3s ease-out; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800">

<!-- 登录页面 -->
<div id="loginPage" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
    <div class="glass rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/50">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-xl mx-auto mb-4 flex items-center justify-center text-white text-2xl font-bold shadow-lg">X</div>
            <h1 class="text-2xl font-bold text-slate-800">Project-X 成绩分析系统</h1>
            <p class="text-slate-500 text-sm mt-2">大连五中信息化部 · 智能试卷管理工具</p>
        </div>

        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="selectRole('teacher')" id="btnTeacher" class="role-btn p-4 rounded-xl border-2 border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition-all text-center">
                    <div class="text-3xl mb-2">👨‍🏫</div>
                    <div class="font-medium">教师端</div>
                </button>
                <button onclick="selectRole('student')" id="btnStudent" class="role-btn p-4 rounded-xl border-2 border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition-all text-center">
                    <div class="text-3xl mb-2">👨‍🎓</div>
                    <div class="font-medium">学生端</div>
                </button>
            </div>

            <div id="loginForm" class="hidden">
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">用户名</label>
                        <input type="text" id="username" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" placeholder="请输入用户名">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">密码</label>
                        <input type="password" id="password" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" placeholder="请输入密码" value="123456">
                    </div>
                    <div id="studentSelector" class="hidden">
                        <label class="block text-sm font-medium text-slate-700 mb-1">选择学生</label>
                        <select id="studentSelect" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white"></select>
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-lg shadow-blue-600/30">
                        登录系统
                    </button>
                </div>
            </div>

            <div class="mt-6 pt-6 border-t border-slate-200 text-center">
                <button onclick="loadDemoData()" class="text-blue-600 hover:text-blue-800 text-sm font-medium underline">🚀 加载演示数据体验功能</button>
            </div>
        </div>
    </div>
</div>

<!-- 主应用页面 -->
<div id="appPage" class="hidden min-h-screen flex">
    <!-- 侧边栏 -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col fixed h-full z-10">
        <div class="p-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">X</div>
                <div>
                    <div class="font-bold text-slate-800">Project-X</div>
                    <div class="text-xs text-slate-500">成绩分析系统</div>
                </div>
            </div>
        </div>

        <nav class="flex-1 py-4 overflow-y-auto" id="sidebarNav">
            <!-- 动态生成 -->
        </nav>

        <div class="p-4 border-t border-slate-200">
            <div class="flex items-center gap-3 p-3 rounded-lg bg-slate-50">
                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-sm" id="userAvatar">T</div>
                <div class="flex-1 min-w-0">
                    <div class="text-sm font-medium truncate" id="userName">教师</div>
                    <div class="text-xs text-slate-500" id="userRole">教师端</div>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors" title="退出登录">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 ml-64">
        <!-- 顶部栏 -->
        <header class="bg-white border-b border-slate-200 px-8 py-4 sticky top-0 z-20 flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-800" id="pageTitle">概览</h2>
            <div class="flex items-center gap-4">
                <select id="examFilter" onchange="filterByExam()" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="all">全部考试</option>
                </select>
                <button onclick="exportData()" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm hover:bg-slate-50 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    导出JSON
                </button>
            </div>
        </header>

        <div class="p-8" id="mainContent">
            <!-- 动态内容 -->
        </div>
    </main>
</div>

<script>
// ==================== 数据层 ====================
const DB_KEY = 'project_x_score_data';

let appData = {
    exams: [],
    students: [],
    scores: [],
    classes: []
};

let currentUser = null;
let currentRole = null;
let currentStudent = null;
let charts = {};

// 初始化/加载数据
function initData() {
    const saved = localStorage.getItem(DB_KEY);
    if (saved) {
        appData = JSON.parse(saved);
    }
}

function saveData() {
    localStorage.setItem(DB_KEY, JSON.stringify(appData));
}

// 生成演示数据
function generateDemoData() {
    const subjects = ['语文', '数学', '英语', '物理', '化学', '生物'];
    const classNames = ['高一(1)班', '高一(2)班', '高一(3)班', '高一(4)班'];
    const examNames = ['第一次月考', '期中考试', '第二次月考', '期末考试'];

    appData.exams = examNames.map((name, i) => ({
        id: `exam_${i}`,
        name: name,
        date: `2025-${9 + Math.floor(i/2)}-${15 + (i%2)*15}`,
        subjects: subjects.map(s => ({ name: s, maxScore: 150 }))
    }));

    appData.classes = classNames;

    const lastNames = ['赵', '钱', '孙', '李', '周', '吴', '郑', '王', '冯', '陈', '褚', '卫', '蒋', '沈', '韩', '杨'];
    const firstNames = ['伟', '芳', '娜', '敏', '静', '丽', '强', '磊', '军', '洋', '勇', '艳', '杰', '娟', '涛', '明'];

    appData.students = [];
    let studentId = 0;
    classNames.forEach((cls, ci) => {
        for (let i = 0; i < 15; i++) {
            const name = lastNames[Math.floor(Math.random() * lastNames.length)] + 
                        firstNames[Math.floor(Math.random() * firstNames.length)] +
                        (Math.random() > 0.5 ? firstNames[Math.floor(Math.random() * firstNames.length)] : '');
            appData.students.push({
                id: `stu_${studentId}`,
                name: name,
                className: cls,
                studentNo: `2025${String(ci+1).padStart(2,'0')}${String(i+1).padStart(2,'0')}`
            });
            studentId++;
        }
    });

    appData.scores = [];
    appData.students.forEach(stu => {
        // 为每个学生生成基础能力值，使成绩有连续性
        const baseAbility = {};
        subjects.forEach(s => {
            baseAbility[s] = 60 + Math.random() * 70; // 基础分60-130
        });

        appData.exams.forEach((exam, ei) => {
            const subjectScores = {};
            let total = 0;
            subjects.forEach(s => {
                // 成绩围绕基础能力波动，随考试推进有趋势
                const trend = ei * (Math.random() * 6 - 2); // 随机趋势
                const noise = (Math.random() - 0.5) * 20;
                let score = Math.round(baseAbility[s] + trend + noise);
                score = Math.max(0, Math.min(150, score));
                subjectScores[s] = score;
                total += score;
            });
            appData.scores.push({
                studentId: stu.id,
                examId: exam.id,
                subjectScores: subjectScores,
                totalScore: total
            });
        });
    });

    saveData();
}

// ==================== 业务逻辑层 ====================

function getStudentScores(studentId, examId = null) {
    let scores = appData.scores.filter(s => s.studentId === studentId);
    if (examId) scores = scores.filter(s => s.examId === examId);
    return scores.sort((a, b) => {
        const idxA = appData.exams.findIndex(e => e.id === a.examId);
        const idxB = appData.exams.findIndex(e => e.id === b.examId);
        return idxA - idxB;
    });
}

function getClassStudents(className) {
    return appData.students.filter(s => s.className === className);
}

function getExamScores(examId, className = null) {
    let scores = appData.scores.filter(s => s.examId === examId);
    if (className) {
        const stuIds = getClassStudents(className).map(s => s.id);
        scores = scores.filter(s => stuIds.includes(s.studentId));
    }
    return scores;
}

function calculateRank(examId, studentId, scope = 'grade') {
    const student = appData.students.find(s => s.id === studentId);
    let scores = getExamScores(examId);
    if (scope === 'class') {
        scores = scores.filter(s => {
            const stu = appData.students.find(st => st.id === s.studentId);
            return stu && stu.className === student.className;
        });
    }
    scores.sort((a, b) => b.totalScore - a.totalScore);
    const rank = scores.findIndex(s => s.studentId === studentId) + 1;
    return { rank, total: scores.length };
}

function calculateClassAvg(examId, className) {
    const scores = getExamScores(examId, className);
    if (scores.length === 0) return null;
    const subjects = appData.exams.find(e => e.id === examId).subjects.map(s => s.name);
    const result = { totalAvg: 0, subjectAvgs: {} };
    let totalSum = 0;
    subjects.forEach(sub => {
        const sum = scores.reduce((acc, s) => acc + s.subjectScores[sub], 0);
        result.subjectAvgs[sub] = Math.round(sum / scores.length * 10) / 10;
    });
    totalSum = scores.reduce((acc, s) => acc + s.totalScore, 0);
    result.totalAvg = Math.round(totalSum / scores.length * 10) / 10;
    return result;
}

function calculateGradeAvg(examId) {
    return calculateClassAvg(examId, null);
}

function getStudentTrend(studentId, subject = null) {
    const scores = getStudentScores(studentId);
    return scores.map(s => {
        const exam = appData.exams.find(e => e.id === s.examId);
        return {
            examName: exam.name,
            total: s.totalScore,
            subject: subject ? s.subjectScores[subject] : null
        };
    });
}

// ==================== UI 层 ====================

function selectRole(role) {
    currentRole = role;
    document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-50');
        btn.classList.add('border-slate-200');
    });
    document.getElementById(role === 'teacher' ? 'btnTeacher' : 'btnStudent').classList.add('border-blue-500', 'bg-blue-50');
    document.getElementById('loginForm').classList.remove('hidden');

    if (role === 'student') {
        document.getElementById('studentSelector').classList.remove('hidden');
        const select = document.getElementById('studentSelect');
        select.innerHTML = appData.students.map(s => `<option value="${s.id}">${s.name} (${s.className})</option>`).join('');
    } else {
        document.getElementById('studentSelector').classList.add('hidden');
    }
}

function handleLogin() {
    const username = document.getElementById('username').value;
    if (!username) { alert('请输入用户名'); return; }

    if (currentRole === 'student') {
        const stuId = document.getElementById('studentSelect').value;
        currentStudent = appData.students.find(s => s.id === stuId);
        currentUser = { name: currentStudent.name, role: 'student' };
    } else {
        currentUser = { name: username || '教师', role: 'teacher' };
    }

    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('appPage').classList.remove('hidden');

    document.getElementById('userName').textContent = currentUser.name;
    document.getElementById('userRole').textContent = currentRole === 'teacher' ? '教师端' : '学生端';
    document.getElementById('userAvatar').textContent = currentUser.name[0];

    initSidebar();
    initExamFilter();

    if (currentRole === 'teacher') {
        showSection('teacherOverview');
    } else {
        showSection('studentDashboard');
    }
}

function logout() {
    location.reload();
}

function loadDemoData() {
    generateDemoData();
    initData();
    alert('演示数据已加载！请选择角色登录体验。');
    // 刷新学生选择器
    if (currentRole === 'student') {
        const select = document.getElementById('studentSelect');
        select.innerHTML = appData.students.map(s => `<option value="${s.id}">${s.name} (${s.className})</option>`).join('');
    }
}

function initSidebar() {
    const nav = document.getElementById('sidebarNav');
    let items = [];

    if (currentRole === 'teacher') {
        items = [
            { id: 'teacherOverview', icon: '📊', label: '数据概览' },
            { id: 'teacherStudents', icon: '👥', label: '学生成绩' },
            { id: 'teacherClassCompare', icon: '📈', label: '班级对比' },
            { id: 'teacherAnalysis', icon: '📝', label: '成绩总结' }
        ];
    } else {
        items = [
            { id: 'studentDashboard', icon: '📋', label: '我的成绩' },
            { id: 'studentTrend', icon: '📉', label: '成绩趋势' },
            { id: 'studentAnalysis', icon: '🔍', label: '成绩分析' }
        ];
    }

    nav.innerHTML = items.map(item => `
        <div class="sidebar-item px-6 py-3 flex items-center gap-3 text-sm font-medium text-slate-600" onclick="showSection('${item.id}')" data-section="${item.id}">
            <span class="text-lg">${item.icon}</span>
            <span>${item.label}</span>
        </div>
    `).join('');
}

function initExamFilter() {
    const select = document.getElementById('examFilter');
    select.innerHTML = '<option value="all">全部考试</option>' + 
        appData.exams.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
}

function showSection(sectionId) {
    // 更新侧边栏激活状态
    document.querySelectorAll('.sidebar-item').forEach(el => {
        el.classList.remove('active');
        if (el.dataset.section === sectionId) el.classList.add('active');
    });

    const content = document.getElementById('mainContent');
    content.innerHTML = '<div class="flex items-center justify-center h-64"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div></div>';

    // 销毁旧图表
    Object.values(charts).forEach(c => c.destroy());
    charts = {};

    setTimeout(() => {
        if (sectionId === 'teacherOverview') renderTeacherOverview();
        else if (sectionId === 'teacherStudents') renderTeacherStudents();
        else if (sectionId === 'teacherClassCompare') renderTeacherClassCompare();
        else if (sectionId === 'teacherAnalysis') renderTeacherAnalysis();
        else if (sectionId === 'studentDashboard') renderStudentDashboard();
        else if (sectionId === 'studentTrend') renderStudentTrend();
        else if (sectionId === 'studentAnalysis') renderStudentAnalysis();
    }, 100);
}

// ==================== 教师端渲染 ====================

function renderTeacherOverview() {
    document.getElementById('pageTitle').textContent = '数据概览';
    const latestExam = appData.exams[appData.exams.length - 1];
    const gradeAvg = calculateGradeAvg(latestExam.id);

    let html = `
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 fade-in">
            <div class="card bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <div class="text-slate-500 text-sm mb-1">学生总数</div>
                <div class="text-3xl font-bold text-slate-800">${appData.students.length}</div>
                <div class="text-xs text-slate-400 mt-2">${appData.classes.length} 个班级</div>
            </div>
            <div class="card bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <div class="text-slate-500 text-sm mb-1">考试次数</div>
                <div class="text-3xl font-bold text-slate-800">${appData.exams.length}</div>
                <div class="text-xs text-slate-400 mt-2">本学期</div>
            </div>
            <div class="card bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <div class="text-slate-500 text-sm mb-1">年级平均分</div>
                <div class="text-3xl font-bold text-blue-600">${gradeAvg ? gradeAvg.totalAvg : '-'}</div>
                <div class="text-xs text-slate-400 mt-2">${latestExam.name}</div>
            </div>
            <div class="card bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <div class="text-slate-500 text-sm mb-1">年级最高分</div>
                <div class="text-3xl font-bold text-emerald-600">${getGradeMax(latestExam.id)}</div>
                <div class="text-xs text-slate-400 mt-2">${latestExam.name}</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 fade-in">
            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 mb-4">各班级平均分对比 (${latestExam.name})</h3>
                <canvas id="classCompareChart" height="250"></canvas>
            </div>
            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 mb-4">年级成绩分布</h3>
                <canvas id="gradeDistChart" height="250"></canvas>
            </div>
        </div>

        <div class="mt-6 bg-white rounded-xl p-6 shadow-sm border border-slate-100 fade-in">
            <h3 class="font-bold text-slate-800 mb-4">年级总分趋势</h3>
            <canvas id="gradeTrendChart" height="120"></canvas>
        </div>
    `;

    document.getElementById('mainContent').innerHTML = html;

    // 班级对比图
    const classAvgs = appData.classes.map(cls => ({
        class: cls.split('(')[1].replace(')', ''),
        avg: calculateClassAvg(latestExam.id, cls).totalAvg
    }));

    charts.classCompare = new Chart(document.getElementById('classCompareChart'), {
        type: 'bar',
        data: {
            labels: classAvgs.map(c => c.class),
            datasets: [{
                label: '班级平均分',
                data: classAvgs.map(c => c.avg),
                backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444'],
                borderRadius: 6
            }]
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 900 } } }
    });

    // 成绩分布图
    const latestScores = getExamScores(latestExam.id);
    const ranges = ['0-300', '300-450', '450-600', '600-750', '750-900'];
    const counts = [0, 0, 0, 0, 0];
    latestScores.forEach(s => {
        const t = s.totalScore;
        if (t < 300) counts[0]++;
        else if (t < 450) counts[1]++;
        else if (t < 600) counts[2]++;
        else if (t < 750) counts[3]++;
        else counts[4]++;
    });

    charts.gradeDist = new Chart(document.getElementById('gradeDistChart'), {
        type: 'doughnut',
        data: {
            labels: ranges,
            datasets: [{
                data: counts,
                backgroundColor: ['#ef4444', '#f97316', '#f59e0b', '#3b82f6', '#10b981'],
                borderWidth: 0
            }]
        },
        options: { responsive: true, cutout: '60%' }
    });

    // 年级趋势图
    const trendData = appData.exams.map(exam => {
        const avg = calculateGradeAvg(exam.id);
        return { name: exam.name, avg: avg.totalAvg };
    });

    charts.gradeTrend = new Chart(document.getElementById('gradeTrendChart'), {
        type: 'line',
        data: {
            labels: trendData.map(t => t.name),
            datasets: [{
                label: '年级平均分',
                data: trendData.map(t => t.avg),
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                fill: true,
                tension: 0.4,
                pointRadius: 5,
                pointBackgroundColor: '#3b82f6'
            }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: false } } }
    });
}

function getGradeMax(examId) {
    const scores = getExamScores(examId);
    return scores.length > 0 ? Math.max(...scores.map(s => s.totalScore)) : '-';
}

function renderTeacherStudents() {

function renderStudentRow(stu, exam) {
    if (!stu.score) return '';
    const rankClass = stu.gradeRank.rank <= 3 ? `rank-${stu.gradeRank.rank}` : 'rank-other';
    const subjects = exam.subjects;

    return `
        <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-6 py-4">
                <span class="rank-badge ${rankClass}">${stu.gradeRank.rank}</span>
            </td>
            <td class="px-6 py-4">
                <span class="rank-badge rank-other">${stu.classRank.rank}</span>
            </td>
            <td class="px-6 py-4 font-medium text-slate-800">${stu.name}</td>
            <td class="px-6 py-4 text-slate-600">${stu.className}</td>
            <td class="px-6 py-4 text-slate-500 font-mono text-xs">${stu.studentNo}</td>
            <td class="px-6 py-4 font-bold text-blue-600">${stu.score.totalScore}</td>
            ${subjects.map(s => {
                const score = stu.score.subjectScores[s.name];
                const color = score >= 120 ? 'text-emerald-600' : score >= 90 ? 'text-slate-700' : 'text-amber-600';
                return `<td class="px-4 py-4 ${color} font-medium">${score}</td>`;
            }).join('')}
            <td class="px-6 py-4">
                <button onclick="showStudentDetail('${stu.id}')" class="text-blue-600 hover:text-blue-800 text-sm font-medium">详情</button>
            </td>
        </tr>
    `;
}

function filterStudents() {
    const search = document.getElementById('stuSearch').value.toLowerCase();
    const cls = document.getElementById('classFilter').value;
    const rows = document.querySelectorAll('#studentTableBody tr');
    rows.forEach(row => {
        const name = row.cells[2].textContent.toLowerCase();
        const className = row.cells[3].textContent;
        const match = name.includes(search) && (cls === 'all' || className === cls);
        row.style.display = match ? '' : 'none';
    });
}

function showStudentDetail(studentId) {
    const stu = appData.students.find(s => s.id === studentId);
    const scores = getStudentScores(studentId);
    const latestExam = appData.exams[appData.exams.length - 1];
    const latestScore = scores.find(s => s.examId === latestExam.id);

    let html = `

            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto fade-in">

                            <div class="text-xs text-emerald-600/70 mt-1">班级排名</div>
                        </div>
                        <div class="bg-purple-50 rounded-xl p-4 text-center">

                        <canvas id="detailTrendChart" height="200"></canvas>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">

                                    <div class="text-xs opacity-70">${s.name}</div>
                                    <div class="text-xl font-bold">${score}</div>
                                    <div class="text-xs opacity-70">${pct}%</div>

                    </div>
                </div>
            </div>
        </div>
    `;

    const modal = document.createElement('div');
    modal.id = 'detailModal';
    modal.innerHTML = html;
    document.body.appendChild(modal);

    // 绘制个人趋势图
    const subjects = latestExam.subjects.map(s => s.name);

function renderTeacherAnalysis() {
    document.getElementById('pageTitle').textContent = '成绩总结报告';
    const examId = document.getElementById('examFilter').value;
    const targetExam = examId === 'all' ? appData.exams[appData.exams.length - 1] : appData.exams.find(e => e.id === examId);

    const gradeAvg = calculateGradeAvg(targetExam.id);
    const classAvgs = appData.classes.map(cls => ({
        name: cls,
        avg: calculateClassAvg(targetExam.id, cls)
    }));

    // 找出最强和最弱班级
    classAvgs.sort((a, b) => b.avg.totalAvg - a.avg.totalAvg);
    const bestClass = classAvgs[0];
    const weakClass = classAvgs[classAvgs.length - 1];

    // 找出最强和最弱科目
    const subjectAvgs = targetExam.subjects.map(s => ({
        name: s.name,
        avg: gradeAvg.subjectAvgs[s.name]
    }));
    subjectAvgs.sort((a, b) => b.avg - a.avg);
    const bestSubject = subjectAvgs[0];
    const weakSubject = subjectAvgs[subjectAvgs.length - 1];

    // 计算分数段人数
    const allScores = getExamScores(targetExam.id);
    const excellent = allScores.filter(s => s.totalScore >= 720).length;
    const good = allScores.filter(s => s.totalScore >= 600 && s.totalScore < 720).length;
    const pass = allScores.filter(s => s.totalScore >= 450 && s.totalScore < 600).length;
    const fail = allScores.filter(s => s.totalScore < 450).length;

    // 计算标准差
    const mean = gradeAvg.totalAvg;
    const variance = allScores.reduce((acc, s) => acc + Math.pow(s.totalScore - mean, 2), 0) / allScores.length;
    const stdDev = Math.sqrt(variance).toFixed(1);

    let html = `
        <div class="max-w-4xl mx-auto space-y-6 fade-in">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl p-8 text-white shadow-lg">
                <h3 class="text-2xl font-bold mb-2">${targetExam.name} 成绩分析报告</h3>
                <p class="text-blue-100">生成时间：${new Date().toLocaleString('zh-CN')}</p>
            </div>

            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <h4 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-sm">1</span>
                    整体概况
                </h4>
                <div class="prose text-slate-600 leading-relaxed">
                    <p>本次考试（${targetExam.name}）全年级共 ${appData.students.length} 名学生参加，覆盖 ${appData.classes.length} 个班级。年级总平均分为 <strong class="text-slate-800">${gradeAvg.totalAvg}</strong> 分，标准差为 ${stdDev}，成绩离散程度${stdDev > 80 ? '较大，学生水平差异明显，建议关注分层教学' : '适中，整体水平较为均衡'}。</p>
                    <p class="mt-2">成绩分布情况：优秀（≥720分）${excellent}人，良好（600-720分）${good}人，及格（450-600分）${pass}人，不及格（<450分）${fail}人。及格率为 ${((excellent+good+pass)/allScores.length*100).toFixed(1)}%。</p>
                </div>
            </div>

            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <h4 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-sm">2</span>
                    班级对比分析
                </h4>
                <div class="prose text-slate-600 leading-relaxed">
                    <p>在本次考试中，<strong class="text-emerald-600">${bestClass.name}</strong> 表现最为突出，班级平均分达到 ${bestClass.avg.totalAvg} 分，位居年级第一。该班级在 ${Object.entries(bestClass.avg.subjectAvgs).sort((a,b)=>b[1]-a[1])[0][0]} 科目上优势最为明显。</p>
                    <p class="mt-2"><strong class="text-amber-600">${weakClass.name}</strong> 本次平均分为 ${weakClass.avg.totalAvg} 分，与第一名相差 ${(bestClass.avg.totalAvg - weakClass.avg.totalAvg).toFixed(1)} 分。建议重点关注该班级的 ${Object.entries(weakClass.avg.subjectAvgs).sort((a,b)=>a[1]-b[1])[0][0]} 科目教学，制定针对性提升计划。</p>
                </div>
                <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3">
                    ${classAvgs.map(c => `
                        <div class="bg-slate-50 rounded-lg p-3 text-center">
                            <div class="text-xs text-slate-500">${c.name.split('(')[1].replace(')', '')}</div>
                            <div class="text-lg font-bold ${c === bestClass ? 'text-emerald-600' : c === weakClass ? 'text-amber-600' : 'text-slate-700'}">${c.avg.totalAvg}</div>
                            <div class="text-xs text-slate-400">平均分</div>
                        </div>
                    `).join('')}
                </div>
            </div>

            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <h4 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span class="w-8 h-8 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center text-sm">3</span>
                    科目分析
                </h4>
                <div class="prose text-slate-600 leading-relaxed">
                    <p>从各科平均分来看，<strong class="text-emerald-600">${bestSubject.name}</strong> 是年级整体表现最好的科目，平均分达到 ${bestSubject.avg} 分；而 <strong class="text-amber-600">${weakSubject.name}</strong> 相对薄弱，平均分为 ${weakSubject.avg} 分，两科相差 ${(bestSubject.avg - weakSubject.avg).toFixed(1)} 分。</p>

                        <p>加强对 ${weakClass.name} 的帮扶力度，建立"一对一"或小组互助机制，缩小班级间差距。</p>

                        <p>针对 ${weakSubject.name} 科目组织备课组研讨，分析失分点，调整后续教学重点。</p>
                    </div>
                    <div class="flex gap-3 items-start">
                        <span class="mt-1 w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>
                        <p>关注不及格学生群体（${fail}人），建立学困生档案，实施分层作业与个性化辅导。</p>

                    <div class="flex gap-3 items-start">
                        <span class="mt-1 w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>
                        <p>保持 ${bestSubject.name} 学科的优势做法，鼓励优秀教师分享经验，推广至其他学科。</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-center pb-8">
                <button onclick="window.print()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow-lg shadow-blue-600/30 transition-colors flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    打印报告
                </button>
            </div>
        </div>
    `;

    document.getElementById('mainContent').innerHTML = html;
}

function renderStudentDashboard() {

    let html = `
        <div class="max-w-5xl mx-auto space-y-6 fade-in">

                    <div class="text-right">

                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                    <div class="text-slate-500 text-sm mb-1">班级排名</div>
                    <div class="text-3xl font-bold text-emerald-600">${classRank.rank}</div>
                    <div class="text-xs text-slate-400 mt-1">共 ${classRank.total} 人</div>
                </div>
                <div class="card bg-white rounded-xl p-5 shadow-sm border border-slate-100">
                    <div class="text-slate-500 text-sm mb-1">年级排名</div>
                    <div class="text-3xl font-bold text-purple-600">${gradeRank.rank}</div>
                    <div class="text-xs text-slate-400 mt-1">共 ${gradeRank.total} 人</div>
                </div>
                <div class="card bg-white rounded-xl p-5 shadow-sm border border-slate-100">
                    <div class="text-slate-500 text-sm mb-1">班级平均分</div>
                    <div class="text-3xl font-bold text-blue-600">${classAvg ? classAvg.totalAvg : '-'}</div>
                    <div class="text-xs text-slate-400 mt-1">${latestExam.name}</div>
                </div>
            </div>

            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 mb-4">最新考试成绩 (${latestExam.name})</h3>
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                    ${latestExam.subjects.map(s => {
                        const score = latestScore ? latestScore.subjectScores[s.name] : 0;
                        const avg = classAvg ? classAvg.subjectAvgs[s.name] : 0;
                        const diff = score - avg;
                        const diffClass = diff >= 0 ? 'text-emerald-600' : 'text-amber-600';
                        const diffIcon = diff >= 0 ? '↑' : '↓';
                        const pct = Math.round(score / s.maxScore * 100);
                        const barColor = pct >= 80 ? 'bg-emerald-500' : pct >= 60 ? 'bg-blue-500' : 'bg-amber-500';
                        return `
                            <div class="bg-slate-50 rounded-xl p-4">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-sm font-medium text-slate-700">${s.name}</span>
                                    <span class="text-xs ${diffClass} font-medium">${diffIcon} ${Math.abs(diff).toFixed(1)}</span>
                                </div>
                                <div class="text-2xl font-bold text-slate-800 mb-2">${score}</div>
                                <div class="w-full bg-slate-200 rounded-full h-2">
                                    <div class="${barColor} h-2 rounded-full transition-all" style="width: ${pct}%"></div>

            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">

                <canvas id="studentTotalChart" height="200"></canvas>
            </div>
        </div>
    `;

    document.getElementById('mainContent').innerHTML = html;

    // 总分对比图（个人 vs 班级平均）
    const trend = appData.exams.map(exam => {
        const s = appData.scores.find(sc => sc.studentId === stu.id && sc.examId === exam.id);
        const clsAvg = calculateClassAvg(exam.id, stu.className);
        return {
            exam: exam.name,
            myScore: s ? s.totalScore : 0,
            classAvg: clsAvg ? clsAvg.totalAvg : 0
        };
    });

    charts.studentTotal = new Chart(document.getElementById('studentTotalChart'), {
        type: 'bar',
        data: {
            labels: trend.map(t => t.exam),
            datasets: [
                {
                    label: '我的成绩',
                    data: trend.map(t => t.myScore),
                    backgroundColor: '#3b82f6',
                    borderRadius: 6,
                    barPercentage: 0.6

                    label: '班级平均',
                    data: trend.map(t => t.classAvg),
                    backgroundColor: '#94a3b8',
                    borderRadius: 6,
                    barPercentage: 0.6
                }
            ]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true, max: 900 } }
        }
    });
}

function renderStudentAnalysis() {
    const stu = currentStudent;
    const scores = getStudentScores(stu.id);
    const latestExam = appData.exams[appData.exams.length - 1];
    const latestScore = scores.find(s => s.examId === latestExam.id);
    const classAvg = calculateClassAvg(latestExam.id, stu.className);
    const gradeAvg = calculateGradeAvg(latestExam.id);

    document.getElementById('pageTitle').textContent = '成绩分析';

    // 分析逻辑
    const subjects = latestExam.subjects;
    let strongSubjects = [];
    let weakSubjects = [];
    let stableSubjects = [];
    let improvedSubjects = [];
    let declinedSubjects = [];

    subjects.forEach(s => {
        const current = latestScore.subjectScores[s.name];
        const classMean = classAvg.subjectAvgs[s.name];
        const gradeMean = gradeAvg.subjectAvgs[s.name];

        if (current >= classMean + 10) strongSubjects.push(s.name);
        else if (current <= classMean - 10) weakSubjects.push(s.name);

        if (scores.length >= 2) {
            const prev = scores[scores.length - 2].subjectScores[s.name];
            const change = current - prev;
            if (change >= 8) improvedSubjects.push({name: s.name, change});
            else if (change <= -8) declinedSubjects.push({name: s.name, change});
            else stableSubjects.push(s.name);
        }
    });

    // 总分趋势判断
    let totalTrend = '稳定';
    let totalTrendColor = 'text-slate-600';
    if (scores.length >= 2) {
        const diff = scores[scores.length-1].totalScore - scores[scores.length-2].totalScore;
        if (diff > 20) { totalTrend = '显著进步'; totalTrendColor = 'text-emerald-600'; }
        else if (diff > 5) { totalTrend = '有所进步'; totalTrendColor = 'text-emerald-500'; }
        else if (diff < -20) { totalTrend = '明显退步'; totalTrendColor = 'text-red-600'; }
        else if (diff < -5) { totalTrend = '略有下滑'; totalTrendColor = 'text-amber-600'; }
    }

    let html = `
        <div class="max-w-4xl mx-auto space-y-6 fade-in">
            <div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl p-6 text-white shadow-lg">
                <h3 class="text-xl font-bold mb-2">${stu.name} 的成绩诊断报告</h3>
                <p class="text-indigo-100">基于 ${appData.exams.length} 次考试数据的智能分析</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                    <h4 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <span class="w-6 h-6 rounded bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs">✓</span>
                        优势科目
                    </h4>
                    ${strongSubjects.length > 0 ? `
                        <div class="space-y-2">
                            ${strongSubjects.map(sub => {
                                const score = latestScore.subjectScores[sub];
                                const avg = classAvg.subjectAvgs[sub];
                                return `
                                    <div class="flex items-center justify-between p-3 bg-emerald-50 rounded-lg">
                                        <span class="font-medium text-emerald-800">${sub}</span>
                                        <span class="text-sm text-emerald-600">${score}分 (超班均${(score-avg).toFixed(1)})</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <p class="text-sm text-slate-500 mt-3">这些科目是你的优势领域，建议保持现有学习方法，可适当减少时间投入。</p>
                    ` : '<p class="text-slate-500 text-sm">暂无显著优势科目，建议均衡发展。</p>'}
                </div>

                <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                    <h4 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <span class="w-6 h-6 rounded bg-amber-100 text-amber-600 flex items-center justify-center text-xs">!</span>
                        薄弱科目
                    </h4>
                    ${weakSubjects.length > 0 ? `
                        <div class="space-y-2">
                            ${weakSubjects.map(sub => {
                                const score = latestScore.subjectScores[sub];
                                const avg = classAvg.subjectAvgs[sub];
                                return `
                                    <div class="flex items-center justify-between p-3 bg-amber-50 rounded-lg">
                                        <span class="font-medium text-amber-800">${sub}</span>
                                        <span class="text-sm text-amber-600">${score}分 (低班均${(avg-score).toFixed(1)})</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <p class="text-sm text-slate-500 mt-3">建议增加这些科目的学习时间，向老师或同学请教，针对性刷题。</p>
                    ` : '<p class="text-slate-500 text-sm">暂无显著薄弱科目，继续保持！</p>'}
                </div>
            </div>

            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100">
                <h4 class="font-bold text-slate-800 mb-4">总体评价</h4>
                <div class="prose text-slate-600 leading-relaxed">
                    <p>在最近的 <strong>${latestExam.name}</strong> 中，你的总分为 <strong>${latestScore.totalScore}</strong> 分，在班级中排名第 <strong>${calculateRank(latestExam.id, stu.id, 'class').rank}</strong>，在年级中排名第 <strong>${calculateRank(latestExam.id, stu.id, 'grade').rank}</strong>。</p>
                    <p class="mt-2">与班级平均分（${classAvg.totalAvg}）相比，你${latestScore.totalScore > classAvg.totalAvg ? '高于' : '低于'}班级平均 <strong>${Math.abs(latestScore.totalScore - classAvg.totalAvg).toFixed(1)}</strong> 分。</p>
                    <p class="mt-2">成绩总体趋势：<strong class="${totalTrendColor}">${totalTrend}</strong>。</p>
                    ${improvedSubjects.length > 0 ? `<p class="mt-2 text-emerald-600">📈 进步明显的科目：${improvedSubjects.map(s => s.name + '(+' + s.change + ')').join('、')}，继续保持！</p>` : ''}
                    ${declinedSubjects.length > 0 ? `<p class="mt-2 text-amber-600">📉 需要关注的科目：${declinedSubjects.map(s => s.name + '(' + s.change + ')').join('、')}，建议分析原因。</p>` : ''}
                </div>
            </div>

            <div class="bg-blue-50 rounded-xl p-6 border border-blue-100">
                <h4 class="font-bold text-blue-800 mb-3">💡 个性化学习建议</h4>
                <ul class="space-y-2 text-blue-700 text-sm">
                    ${weakSubjects.length > 0 ? `<li>• 优先补习：${weakSubjects.join('、')}，建议每天额外安排30分钟专项练习。</li>` : ''}
                    ${strongSubjects.length > 0 ? `<li>• 保持优势：${strongSubjects.join('、')}，可适当减少时间，用于攻克薄弱科目。</li>` : ''}
                    <li>• 建立错题本，定期回顾 ${latestExam.subjects.map(s=>s.name).join('、')} 的易错知识点。</li>
                    <li>• 关注考试心态调整，避免因紧张导致发挥失常。</li>
                </ul>
            </div>
        </div>
    `;

    document.getElementById('mainContent').innerHTML = html;
}

function filterByExam() {
    const activeSection = document.querySelector('.sidebar-item.active');
    if (activeSection) {
        showSection(activeSection.dataset.section);
    }
}

function exportData() {
    const dataStr = JSON.stringify(appData, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'project-x-scores.json';
    a.click();
    URL.revokeObjectURL(url);
}

document.addEventListener('DOMContentLoaded', () => {
    initData();
    if (appData.students.length === 0) {
        generateDemoData();
    }
});

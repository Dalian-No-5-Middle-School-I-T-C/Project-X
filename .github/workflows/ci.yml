name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install Linux platform binaries (npm bug #4828)
        run: npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @esbuild/linux-x64

      - name: Rebuild native module (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Auth / RBAC test suite
        run: npm run verify:auth

      - name: Core logic verify suite
        run: npm run verify:core-logic

      - name: Ladder student identity regression
        run: npx tsx scripts/verify-ladder-students.ts

      - name: Class teacher verify suite
        run: npm run verify:class-teachers

      # 学生端满分口径与 examTime 归一化（PR #305 自带脚本，此前只在本地跑过）
      - name: Student score full-score / examTime regression
        run: npm run verify:student-score-display

      # Issue #322：学生网页端不能改阅卷/评分设置，也不能看到或上传背景图
      - name: Student web settings and background regression
        run: npm run verify:student-web-settings

      - name: Class archive / student link regression
        run: npm run verify:class-archive

      # 安全整改回归：关键安全项（R01/R02/R04/R07/R22/R28 + 上传/试卷池配额）与
      # 权限边界项（R03/R06/R08/R09/R13/R15/R18/R21/R29/R47）。两者都用临时隔离库，
      # 不依赖服务容器，可并行在 SQLite 上跑。
      - name: Security-critical regression
        run: npm run verify:security-critical

      - name: Automatic publication withdrawal policy
        env:
          TEST_AUTO_UNPUBLISH: "1"
        run: |
          npm run verify:security-critical
          npm run verify:scanner-batch-results
          npm run verify:scanner-correction-safety

      - name: Permission-scope regression
        run: npm run verify:permission-scope

      # 部分成绩可公布；名单身份校验和管理员控制的撤回策略单独覆盖。
      - name: Score publication integrity regression
        run: npm run verify:p1-integrity && npm run verify:p1-scope && npm run verify:p1-readgate && npm run verify:exam-paper

      - name: Exam-time class membership regression
        run: npm run verify:exam-class-memberships

      - name: Linux x86_64 correction recognizer geometry
        run: npm run verify:recognizer-geometry
      - name: Native red pen recognition at 150 and 300 DPI
        env:
          ANSWER_CARD_RECOGNIZER_EXE: resources/native/correction-linux-x64/answer-card-recognizer
        run: npm run verify:recognizer-red-line
      # issue #331 ③：同一张卡、同一条红笔斜线，彩色读到分数、灰度归零——「有时读不到」的机制
      - name: Linux x86_64 red pen score cells
        run: npm run verify:recognizer-red-pen
      - name: Full-card correction and legacy recognition drafts (SQLite)
        run: npm run verify:scan-correction && npm run verify:scan-correction-security && npm run verify:scanner-pending && npm run verify:scanner-retry-concurrency && npm run verify:ladder-options-soft-delete
      # v57 空置 + 「阅卷中已公布」考试不被强制结考，并检查两套方言迁移版本号不撞号
      - name: Grading-published exam and migration numbering
        run: npm run verify:grading-published-exam

      - name: Scan page numbering regression
        run: npm run verify:scan-page-numbering

      - name: Scanner page timeout default regression
        run: npm run verify:scanner-page-timeout
      # issue #331 ②：进纸器批次为什么只收到一张——编译真实扫描循环跑假 DSM，
      # 覆盖在途帧续等、ENDOFLJOB 正常收尾、双面配对与能力回退。
      - name: Scanner in-flight frames and bridge diagnostics
        run: npm run verify:scanner-adf-recheck

      # issue #331 ①：设定 DPI 是否真的生效——用桥接回报的像素尺寸反查实际密度，
      # 并要求结论走到 [checkpoint] 日志与扫描端告警。
      - name: Scanner delivered DPI cross-check
        run: npm run verify:scanner-delivered-dpi

      # issue #331 ③：含红笔分数格的卡色彩模式由服务端定，全批零红笔必须告警而不是静默 0 分
      - name: Scanner red pen score color mode regression
        run: npm run verify:scanner-red-pen-colormode

      # 复核 P2：告警只发给当时的 SSE 监听者会永久缺席——落会话行并在订阅时补发
      - name: Scanner warning persistence and SSE replay
        run: npm run verify:scanner-warning-replay

      - name: Scanner upload manager recovery
        run: npm run verify:scanner-upload-manager
      - name: Scanner panel React and SSE session metadata
        run: npm run verify:scanner-panel-session
      - name: Scanner partial transfer failure persistence
        run: npm run verify:scanner-partial-failure

      - name: Scanner batch results smoke
        run: npm run verify:scanner-batch-results
      - name: Scanner duplicate evidence and manual discard
        run: npm run verify:scanner-duplicate-rescan
      - name: Scanner review recovery and receipt query budget
        run: npm run verify:scanner-review-regressions
      - name: Scanner abnormal upload and manual recovery
        run: npm run verify:scanner-upload-flow
      - name: Scanner duplex correction after partial upload
        run: npm run verify:scanner-duplex-correction
      - name: Scanner correction preserves valid grades
        run: npm run verify:scanner-correction-safety
      - name: Scanner review fixes
        run: npm run verify:scanner-review-fixes
      - name: Scanner batch timeout
        run: npm run verify:scanner-scan-timeout

      - name: Plaintext remote transport guard (R32)
        run: npm run verify:insecure-remote-transport

      # 演示数据凭据与导入闸门（R33/R48）：随机口令、teacher_role 收敛、生产库二次确认、
      # 演示卡号撞真实卡整单拒绝。脚本自带一次性临时库，不依赖服务容器。
      - name: Demo credentials / import gates (R33/R48)
        run: npm run verify:demo-credentials

      # Ubuntu 服务器包的 systemd 单元与安装脚本（R37）：非 root 身份、UMask=0027、
      # 数据目录 0750、沙箱指令齐全，且刻意不启用会打死 V8 JIT 的 MemoryDenyWriteExecute。
      # 纯静态断言 + bash -n 语法检查，直接 require 生成器，不需要 dist/。
      - name: Ubuntu server package systemd hardening (R37)
        run: npm run verify:systemd-hardening

      # 发布产物完整性清单（R42）：exe/msi 没有代码签名（无证书，且证书不得入库），
      # 处置是每次打包都生成 SHA256SUMS.txt + BUILD-INTEGRITY.txt，并把签名状态如实写出来。
      # 脚本用一次性临时目录真跑生成与校验（含篡改 / 多出文件 / 缺清单三条失败路径）。
      - name: Release artifact integrity manifest (R42)
        run: npm run verify:release-integrity

      # 答题卡导出版本绑定（R45）：/pdf 现在会核对 ?v= 传来的 revision，
      # 版本对不上就 409，不再让「打印的这版」和「阅卷坐标那版」悄悄分叉。
      # 脚本自带一次性临时库，并证明同一秒内多次保存靠 updated_at 分不开、靠 revision 分得开。
      - name: Answer card export revision gate (R45)
        run: npm run verify:card-export-revision

      # 上面锁的是生成物内容；这里再用 systemd 自己的解析器复核单元能否被接受。
      # 运行器上既没有 projectx 账号也没有 /usr/bin/node，告警属预期，所以只作参考、不判失败。
      - name: systemd-analyze verify (advisory)
        continue-on-error: true
        run: |
          mkdir -p /tmp/px-unit
          node -e "const p=require('./scripts/package-server-ubuntu.cjs');require('fs').writeFileSync('/tmp/px-unit/project-x-server.service',p.createSystemdUnit())"
          systemd-analyze verify /tmp/px-unit/project-x-server.service || true
          systemd-analyze security --offline --root=/ /tmp/px-unit/project-x-server.service || true

      - name: UCRT staging path regression
        run: npm run verify:stage-vc-runtime

  mariadb-test:
    name: MariaDB 10.11 Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: projectx_ci
          MARIADB_USER: projectx_ci
          MARIADB_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PROJECTX_MARIADB_HOST: 127.0.0.1
      PROJECTX_MARIADB_PORT: 3306
      PROJECTX_MARIADB_USER: projectx_ci
      PROJECTX_MARIADB_PASSWORD: ci-test-password
      PROJECTX_MARIADB_DATABASE: projectx_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Linux platform binaries (npm bug #4828)
        run: npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
      - name: MariaDB integration tests
        run: npm run verify:mariadb
      # 归档/分班关联、天梯排名与演示数据闸门改的都是 SQL，生产方言是 MariaDB，只在 SQLite 上跑等于
      # 没验证。三个脚本各自要求「空的专用库」（verify:mariadb 已经在 projectx_ci 里
      # 留下建表与成绩数据，不能复用），故先用 root 建库并授权给 projectx_ci。
      - name: Create disposable databases for the MariaDB regressions
        env:
          # 与上面 services.mariadb 的初始化口令一致（CI 专用一次性凭据）
          MARIADB_ROOT_PASSWORD: ci-root-password
        run: |
          mysql -h 127.0.0.1 -u root -p"$MARIADB_ROOT_PASSWORD" <<'SQL'
          CREATE DATABASE IF NOT EXISTS projectx_class_archive_test CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_ladder_test CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_demo_credentials_test CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_card_revision_test CHARACTER SET utf8mb4;
          GRANT ALL PRIVILEGES ON projectx_class_archive_test.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_ladder_test.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_demo_credentials_test.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_card_revision_test.* TO 'projectx_ci'@'%';

          CREATE DATABASE IF NOT EXISTS projectx_exam_classes_test CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_migration_test CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_pending_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_retry_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_ladder_options_ci CHARACTER SET utf8mb4;
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_ladder_options_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_retry_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_pending_ci.* TO 'projectx_ci'@'%';
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_card_correction_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_dup_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_flow_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_review_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_version_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_duplex_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_partial_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_correction_ci CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_scanner_batch_warning_ci CHARACTER SET utf8mb4;
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_dup_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_flow_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_review_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_version_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_duplex_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_partial_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_correction_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_warning_ci.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_exam_classes_test.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_migration_test.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_scanner_batch_card_correction_ci.* TO 'projectx_ci'@'%';
          FLUSH PRIVILEGES;
          SQL
      - name: Scanner recovery MariaDB regression
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_ci
        run: npm run verify:scanner-batch-results
      - name: Scanner duplicate evidence MariaDB regression
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_dup_ci
        run: npm run verify:scanner-duplicate-rescan
      - name: Scanner abnormal upload MariaDB regression
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_flow_ci
        run: npm run verify:scanner-upload-flow
      - name: Scanner review repair and receipt budget MariaDB regression
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_review_ci
        run: npm run verify:scanner-review-regressions
      - name: Scanner unknown historical version MariaDB regression
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_version_ci
        run: npx tsx scripts/scanner-version-regression.ts
      - name: Scanner duplex correction MariaDB regression
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_duplex_ci
        run: npm run verify:scanner-duplex-correction
      - name: Full-card correction and legacy recognition drafts (MariaDB)
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_card_correction_ci
        run: npm run verify:scan-correction
      - name: Scanner pending confirmation MariaDB regression
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_pending_ci
        run: npm run verify:scanner-pending
      - name: Scanner OCR retry and human correction concurrency (MariaDB)
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_retry_ci
        run: npm run verify:scanner-retry-concurrency
      - name: Scanner partial transfer failure on MariaDB
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_partial_ci
        run: npm run verify:scanner-partial-failure
      - name: Student ladder soft-deleted group members (MariaDB)
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_ladder_options_ci
        run: npm run verify:ladder-options-soft-delete
      - name: Scanner correction preserves valid grades on MariaDB
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_correction_ci
        run: npm run verify:scanner-correction-safety
      - name: Scanner warning replay ordering (MariaDB)
        # 告警落库与终态写入的先后关系是异步的：SQLite 走同步驱动、MariaDB 走连接池真异步，
        # 「延迟写入 → 期间写终态 → 重连」这条竞态只有在生产方言上才算验过。
        env:
          SCANNER_BATCH_MARIADB: "1"
          PROJECTX_MARIADB_DATABASE: projectx_scanner_batch_warning_ci
        run: npm run verify:scanner-warning-replay
      - name: Class archive MariaDB regression
        env:
          PROJECTX_MARIADB_DATABASE: projectx_class_archive_test
        run: npm run verify:class-archive:mariadb
      - name: Ladder student identity regression (MariaDB)
        env:
          PROJECTX_MARIADB_DATABASE: projectx_ladder_test
        run: npx tsx scripts/verify-ladder-students.ts --mariadb
      # 演示数据的归属判据（is_demo 是 TINYINT）、buildInsertIgnore、IN 占位符与 COUNT 取整
      # 都是方言敏感点，R33/R48 的闸门必须在 MariaDB 上同样成立。
      - name: Demo credentials / import gates (R33/R48, MariaDB)
        env:
          PROJECTX_MARIADB_DATABASE: projectx_demo_credentials_test
        run: npm run verify:demo-credentials:mariadb
      # revision 自增走的是 SQL（revision = revision + 1）、updated_at 是 DATETIME（无小数位），
      # 两处都是方言敏感点：MariaDB 上同样要证明秒级时间戳分不开同批保存、revision 分得开。
      - name: Answer card export revision gate (R45, MariaDB)
        env:
          PROJECTX_MARIADB_DATABASE: projectx_card_revision_test
        run: npm run verify:card-export-revision:mariadb

      - name: Exam-time class membership regression (MariaDB)
        env:
          PROJECTX_MARIADB_DATABASE: projectx_exam_classes_test
        run: npm run verify:exam-class-memberships:mariadb

      - name: Rebuild SQLite module for migration regression
        run: npm rebuild better-sqlite3
      - name: SQLite to MariaDB migration regression
        env:
          PROJECTX_MARIADB_DATABASE: projectx_migration_test
        run: npm run verify:mariadb-migration

  llmclient-python-test:
    name: LLM Sidecar (Python) Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 边车回归必须真装依赖跑：`requirements.txt` 里的 PyMuPDF 是 R16 渲染隔离用例的前提，
      # 缺它时那几条会自动 skip——「CI 全绿」就证明不了「解压炸弹页被拒绝」这类边界被验过。
      - name: Install sidecar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r llmclient/requirements.txt

      - name: PDF render isolation regression (R16)
        run: python llmclient/scripts/verify_pdf_render_isolation.py

      - name: LLM usage accounting regression
        run: python llmclient/scripts/verify_llm_usage.py

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck-and-test, mariadb-test, llmclient-python-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install Linux platform binaries (npm bug #4828)
        run: npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @esbuild/linux-x64

      - name: Rebuild native module
        run: npm rebuild better-sqlite3

      - name: Build (web)
        run: npm run build

      - name: Build (scanner)
        run: npm run build:scanner:full

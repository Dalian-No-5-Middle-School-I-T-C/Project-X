name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install Linux platform binaries (npm bug #4828)
        run: npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @esbuild/linux-x64

      - name: Rebuild native module (better-sqlite3)
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Auth / RBAC test suite
        run: npm run verify:auth

      - name: Core logic verify suite
        run: npm run verify:core-logic

      - name: Ladder student identity regression
        run: npx tsx scripts/verify-ladder-students.ts

      - name: Class teacher verify suite
        run: npm run verify:class-teachers

      # 学生端满分口径与 examTime 归一化（PR #305 自带脚本，此前只在本地跑过）
      - name: Student score full-score / examTime regression
        run: npm run verify:student-score-display

      - name: Class archive / student link regression
        run: npm run verify:class-archive

      # 安全整改回归：关键安全项（R01/R02/R04/R07/R22/R28 + 上传/试卷池配额）与
      # 权限边界项（R03/R06/R08/R09/R13/R15/R18/R21/R29/R47）。两者都用临时隔离库，
      # 不依赖服务容器，可并行在 SQLite 上跑。
      - name: Security-critical regression
        run: npm run verify:security-critical

      - name: Permission-scope regression
        run: npm run verify:permission-scope

      # 成绩公布完整性（#248 P1-1/P1-2）：公布前必须「应考集合 ⊆ 已评分集合」，
      # 且不存在「仅校验非空」退路。三条脚本各自使用临时 SQLite 库。
      - name: Score publication integrity regression
        run: npm run verify:p1-integrity && npm run verify:p1-scope && npm run verify:p1-readgate

      # v57 空置 + 「阅卷中已公布」考试不被强制结考，并检查两套方言迁移版本号不撞号
      - name: Grading-published exam and migration numbering
        run: npm run verify:grading-published-exam

      - name: Scan page numbering regression
        run: npm run verify:scan-page-numbering

      - name: Scanner page timeout default regression
        run: npm run verify:scanner-page-timeout

      - name: Scanner batch results smoke
        run: npm run verify:scanner-batch-results

      - name: UCRT staging path regression
        run: npm run verify:stage-vc-runtime

  mariadb-test:
    name: MariaDB 10.11 Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: projectx_ci
          MARIADB_USER: projectx_ci
          MARIADB_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PROJECTX_MARIADB_HOST: 127.0.0.1
      PROJECTX_MARIADB_PORT: 3306
      PROJECTX_MARIADB_USER: projectx_ci
      PROJECTX_MARIADB_PASSWORD: ci-test-password
      PROJECTX_MARIADB_DATABASE: projectx_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Linux platform binaries (npm bug #4828)
        run: npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
      - name: MariaDB integration tests
        run: npm run verify:mariadb
      # 归档/分班关联与天梯排名都改的是 SQL，生产方言是 MariaDB，只在 SQLite 上跑等于
      # 没验证。两个脚本各自要求「空的专用库」（verify:mariadb 已经在 projectx_ci 里
      # 留下建表与成绩数据，不能复用），故先用 root 建库并授权给 projectx_ci。
      - name: Create disposable databases for the MariaDB regressions
        env:
          # 与上面 services.mariadb 的初始化口令一致（CI 专用一次性凭据）
          MARIADB_ROOT_PASSWORD: ci-root-password
        run: |
          mysql -h 127.0.0.1 -u root -p"$MARIADB_ROOT_PASSWORD" <<'SQL'
          CREATE DATABASE IF NOT EXISTS projectx_class_archive_test CHARACTER SET utf8mb4;
          CREATE DATABASE IF NOT EXISTS projectx_ladder_test CHARACTER SET utf8mb4;
          GRANT ALL PRIVILEGES ON projectx_class_archive_test.* TO 'projectx_ci'@'%';
          GRANT ALL PRIVILEGES ON projectx_ladder_test.* TO 'projectx_ci'@'%';
          FLUSH PRIVILEGES;
          SQL
      - name: Class archive MariaDB regression
        env:
          PROJECTX_MARIADB_DATABASE: projectx_class_archive_test
        run: npm run verify:class-archive:mariadb
      - name: Ladder student identity regression (MariaDB)
        env:
          PROJECTX_MARIADB_DATABASE: projectx_ladder_test
        run: npx tsx scripts/verify-ladder-students.ts --mariadb

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck-and-test, mariadb-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install Linux platform binaries (npm bug #4828)
        run: npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @esbuild/linux-x64

      - name: Rebuild native module
        run: npm rebuild better-sqlite3

      - name: Build (web)
        run: npm run build

      - name: Build (scanner)
        run: npm run build:scanner:full

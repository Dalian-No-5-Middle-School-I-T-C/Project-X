name: Publish release

# 在仓库 Actions 里手动发版，形状对齐 Rhine 的 Publish Versioned Release：
# 先核对版本与主干，再调用 release-build.yml 出包，最后建 GitHub Release。
# 工作流自己打标签，不要求事先 git push tag；已有同名标签或 Release 直接拒绝，避免覆盖。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（v主.次.修订，须与 package.json 一致，且仓库里还没有这个标签）
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Version gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read package.json version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -e 'process.stdout.write(require("./package.json").version)')"
          tag="$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          expected="v$version"
          if [ "$tag" != "$expected" ]; then
            echo "::error title=版本对不上::要发布的标签是 $tag，package.json 是 $expected。先改版本号再发，工作流不替你改。"
            exit 1
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=标签格式不对::请用 v主.次.修订，例如 v2.7.2。"
            exit 1
          fi
          # 发出去的必须是主干当前提交。behind 表示更早的提交，放行就会把旧源码发成最新版。
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq '.status')"
          if [ "$status" != "identical" ]; then
            echo "::error title=不是 main 的当前提交::本次运行的 ${GITHUB_SHA} 与 main 的关系是 $status。请在 main 上运行 Publish release。"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=$tag 已经发布过::换版本号。不覆盖已有 Release。"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error title=标签已存在::$tag 已经在仓库里。升版本后再发，不复用旧标签。"
            exit 1
          fi
          echo "将在 main 的 ${GITHUB_SHA} 上发布 $tag"

  build:
    name: Build packages
    needs: prepare
    uses: ./.github/workflows/release-build.yml
    with:
      build_scanner: true
      build_server: true

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Assemble release files
        run: |
          set -euo pipefail
          mkdir -p out
          for lane in scanner-ia32-windows server-ubuntu24; do
            dir="staging/$lane"
            # 每条产物线都必须交齐三样：载荷、校验清单、完整性报告。
            # upload-artifact 的 if-no-files-found 是按整批判的，只缺清单时它仍会成功上传，
            # 所以这里逐样点名要求——缺一律不发，不能让 Release 少一份验证材料。
            if [ ! -d "$dir" ]; then
              echo "::error title=$lane 没有工件目录::上游作业没交出工件（或被跳过），宁可不发也不发缺包的 Release。"
              exit 1
            fi
            payloads=0
            while IFS= read -r file; do
              base="$(basename "$file")"
              if [ -e "out/$base" ] && ! cmp -s "$file" "out/$base"; then
                echo "::error title=两条产物线交出同名不同物的文件::$base 内容不同，随便发哪一个都和清单对不上。"
                exit 1
              fi
              cp "$file" "out/$base"
              payloads=$((payloads + 1))
            done < <(find "$dir" -type f \( -name '*.msi' -o -name '*.zip' \))
            if [ "$payloads" -eq 0 ]; then
              echo "::error title=$lane 没交出安装包::工件目录在，但里面没有 msi / zip。"
              exit 1
            fi
            sums="$(find "$dir" -type f -name SHA256SUMS.txt | head -1)"
            integrity="$(find "$dir" -type f -name BUILD-INTEGRITY.txt | head -1)"
            if [ -z "$sums" ] || [ -z "$integrity" ]; then
              echo "::error title=$lane 缺验证材料::$( [ -z "$sums" ] && echo 'SHA256SUMS.txt ' )$( [ -z "$integrity" ] && echo 'BUILD-INTEGRITY.txt' )。"
              exit 1
            fi
            cp "$integrity" "out/${lane}-BUILD-INTEGRITY.txt"
            kept=0
            : > "out/${lane}-SHA256SUMS.txt"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              digest="${line%% *}"
              rel="${line#*  }"
              base="$(basename "$rel")"
              [ -e "out/$base" ] || continue
              printf '%s  %s\n' "$digest" "$base" >> "out/${lane}-SHA256SUMS.txt"
              kept=$((kept + 1))
            done < "$sums"
            if [ "$kept" -eq 0 ]; then
              echo "::error title=清单与实际产物对不上::$sums 里没有任何文件被收到 out/ 里。"
              exit 1
            fi
          done
          if [ "$(find out -maxdepth 1 -type f \( -name '*.msi' -o -name '*.zip' \) | wc -l)" -eq 0 ]; then
            echo "::error title=没有可发布的产物::上游构建没交出 msi / zip，终止发布。"
            exit 1
          fi
          ls -la out
          for manifest in out/*-SHA256SUMS.txt; do
            [ -e "$manifest" ] || continue
            (cd out && sha256sum -c "$(basename "$manifest")")
          done

      - name: Write release notes
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          commit="$(git rev-parse --short HEAD)"
          {
            echo "## Project-X v${version}"
            echo
            echo "- 构建提交：\`${commit}\`"
            echo "- 发布构建：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "### 安装包"
            echo
            for f in out/*.msi out/*.zip; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"
              size="$(numfmt --to=iec --suffix=B -- "$(stat -c%s "$f")")"
              sha="$(sha256sum "$f" | cut -d' ' -f1)"
              echo "- \`$base\` · $size"
              echo "  - SHA256 \`${sha}\`"
            done
            echo
            echo "### 怎么选"
            echo
            echo "- **答题卡扫描端-…-ia32.msi**：32 位 Windows 扫描工作站用这个，现场部署就是 ia32；装之前先装好扫描仪的 32 位 TWAIN 驱动。"
            echo "- **project-x-server-ubuntu24-….zip**：Ubuntu 24 服务端包，部署入口见包内《Ubuntu24浏览器版部署说明.md》。"
            echo
            echo "### 校验与签名"
            echo
            echo "安装包**没有代码签名**（仓库不含证书，证书也不入库），首次安装时 Windows 会提示未知发布者。"
            echo "配套的清单按构建线改名：\`scanner-ia32-windows-SHA256SUMS.txt\` 与 \`server-ubuntu24-SHA256SUMS.txt\`，"
            echo "另有两份 \`*-BUILD-INTEGRITY.txt\` 写明版本、构建提交与签名状态。"
            echo "把清单和安装包放在同一个目录里就能直接校验："
            echo
            echo '```powershell'
            echo "# Windows：算出下载文件的 SHA256，与清单里的值对比"
            echo "Get-FileHash .\\答题卡扫描端-${version}-ia32.msi -Algorithm SHA256"
            echo '```'
            echo
            echo '```bash'
            echo "# Linux（GNU coreutils）"
            echo "sha256sum project-x-server-ubuntu24-${version}.zip"
            echo "# macOS 没有 sha256sum，用自带的："
            echo "shasum -a 256 project-x-server-ubuntu24-${version}.zip"
            echo '```'
            echo
            echo "安装包不保证逐字节复现：同一份源码两次构建的 PE 头里带构建时间戳，SHA256 会变。"
            echo "核对请看清单与实际安装运行，不要只比哈希。"
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Project-X v${{ needs.prepare.outputs.version }}" \
            --notes-file notes.md \
            out/*

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project-X · 答题卡设计器 Demo（独立 / Flat 2.0）</title>
<style>
/* ════════════════════════════════════════════════════════════════════
   主题层令牌（来自 design/tokens/tokens.css，L1 Primitive + L2 Semantic + L3）
   ════════════════════════════════════════════════════════════════════ */
:root{
  --px-red-50:#FCF3F4;--px-red-100:#F8E3E6;--px-red-200:#F1C2C9;--px-red-300:#E595A1;
  --px-red-400:#D95E70;--px-red-500:#CE3348;--px-red-600:#C00F28;--px-red-700:#A10D22;
  --px-red-800:#7C0A1B;--px-red-900:#560712;--px-red-950:#38040C;
  --px-gray-0:#FFFFFF;--px-gray-50:#FAFAFA;--px-gray-100:#F4F4F5;--px-gray-200:#E4E4E7;
  --px-gray-300:#D4D4D8;--px-gray-400:#A1A1AA;--px-gray-500:#71717A;--px-gray-600:#52525B;
  --px-gray-700:#3F3F46;--px-gray-800:#27272A;--px-gray-900:#18181B;--px-gray-950:#0B0B0D;
  --px-green-500:#22C55E;--px-green-600:#16A34A;--px-green-700:#15803D;
  --px-amber-500:#F59E0B;--px-amber-600:#D97706;--px-amber-700:#B45309;
  --px-blue-500:#3B82F6;--px-blue-600:#2563EB;--px-blue-700:#1D4ED8;
  --px-chart-1:#C00F28;--px-chart-2:#2563EB;--px-chart-3:#16A34A;--px-chart-4:#D97706;
  --px-chart-5:#7C3AED;--px-chart-6:#0891B2;--px-chart-7:#DB2777;--px-chart-8:#71717A;
  --px-space-1:4px;--px-space-2:8px;--px-space-3:12px;--px-space-4:16px;--px-space-5:20px;
  --px-space-6:24px;--px-space-8:32px;
  --px-radius-xs:4px;--px-radius-sm:6px;--px-radius-md:8px;--px-radius-lg:12px;--px-radius-xl:16px;
  --px-text-xs:12px;--px-text-sm:13px;--px-text-base:14px;--px-text-lg:16px;--px-text-xl:18px;--px-text-2xl:20px;
  --px-font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --px-dur-1:100ms;--px-dur-2:160ms;--px-dur-3:240ms;
  --px-ease-out:cubic-bezier(0,0,0.2,1);
  --px-z-header:100;--px-z-toast:500;
  --px-control-h-md:36px;--px-rail-w:232px;--px-rail-collapsed-w:64px;--px-context-panel-w:300px;
  --px-page-header-h:60px;--px-statusbar-h:30px;
}
:root,[data-theme="light"]{
  color-scheme:light;
  --px-bg-canvas:var(--px-gray-100);--px-bg-surface:var(--px-gray-0);--px-bg-raised:var(--px-gray-0);
  --px-bg-subtle:var(--px-gray-50);--px-bg-muted:var(--px-gray-100);--px-bg-scrim:rgba(24,24,27,.40);
  --px-fg-primary:var(--px-gray-900);--px-fg-secondary:var(--px-gray-600);--px-fg-tertiary:var(--px-gray-500);
  --px-fg-disabled:var(--px-gray-400);--px-fg-on-accent:#FFFFFF;
  --px-border-subtle:rgba(24,24,27,.06);--px-border-default:rgba(24,24,27,.10);--px-border-strong:rgba(24,24,27,.18);
  --px-accent-bg:var(--px-red-600);--px-accent-bg-hover:var(--px-red-700);--px-accent-bg-active:var(--px-red-800);
  --px-accent-soft:var(--px-red-50);--px-accent-soft-hover:var(--px-red-100);--px-accent-fg:var(--px-red-700);
  --px-accent-border:var(--px-red-200);--px-accent-ring:rgba(192,15,40,.30);
  --px-success-bg:var(--px-green-600);--px-success-soft:var(--px-green-50);--px-success-fg:var(--px-green-700);--px-success-border:var(--px-green-100);
  --px-warning-bg:var(--px-amber-600);--px-warning-soft:var(--px-amber-50);--px-warning-fg:var(--px-amber-700);--px-warning-border:var(--px-amber-100);
  --px-danger-bg:var(--px-red-600);--px-danger-soft:var(--px-red-50);--px-danger-fg:var(--px-red-700);--px-danger-border:var(--px-red-200);
  --px-info-bg:var(--px-blue-600);--px-info-soft:var(--px-blue-50);--px-info-fg:var(--px-blue-700);--px-info-border:var(--px-blue-100);
  --px-shadow-1:0 1px 2px rgba(24,24,27,.05);--px-shadow-2:0 1px 2px rgba(24,24,27,.04),0 4px 12px rgba(24,24,27,.06);
  --px-shadow-3:0 2px 4px rgba(24,24,27,.05),0 12px 32px rgba(24,24,27,.10);
  --px-focus-ring:0 0 0 2px var(--px-bg-canvas),0 0 0 4px var(--px-accent-ring);
  --px-paper-bg:#FFFFFF;--px-paper-fg:#1A1A1A;
  --px-selection-bg:rgba(192,15,40,.14);
}
[data-theme="dark"]{
  color-scheme:dark;
  --px-bg-canvas:#101013;--px-bg-surface:#17171B;--px-bg-raised:#1E1E23;--px-bg-subtle:#1B1B20;
  --px-bg-muted:#222228;--px-bg-scrim:rgba(0,0,0,.56);
  --px-fg-primary:#F4F4F5;--px-fg-secondary:#A1A1AA;--px-fg-tertiary:#8B8B94;--px-fg-disabled:#5C5C66;--px-fg-on-accent:#FFFFFF;
  --px-border-subtle:rgba(255,255,255,.07);--px-border-default:rgba(255,255,255,.11);--px-border-strong:rgba(255,255,255,.18);
  --px-accent-bg:#D93851;--px-accent-bg-hover:#E0485F;--px-accent-bg-active:#C00F28;
  --px-accent-soft:rgba(217,56,81,.14);--px-accent-soft-hover:rgba(217,56,81,.20);--px-accent-fg:#F28393;
  --px-accent-border:rgba(217,56,81,.35);--px-accent-ring:rgba(217,56,81,.45);
  --px-success-bg:#22C55E;--px-success-soft:rgba(34,197,94,.14);--px-success-fg:#4ADE80;--px-success-border:rgba(34,197,94,.30);
  --px-warning-bg:#F59E0B;--px-warning-soft:rgba(245,158,11,.14);--px-warning-fg:#FBBF24;--px-warning-border:rgba(245,158,11,.30);
  --px-danger-bg:#D93851;--px-danger-soft:rgba(217,56,81,.14);--px-danger-fg:#F28393;--px-danger-border:rgba(217,56,81,.35);
  --px-info-bg:#3B82F6;--px-info-soft:rgba(59,130,246,.14);--px-info-fg:#60A5FA;--px-info-border:rgba(59,130,246,.30);
  --px-shadow-1:0 1px 2px rgba(0,0,0,.40);--px-shadow-2:0 1px 2px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.40);
  --px-shadow-3:0 2px 4px rgba(0,0,0,.40),0 12px 32px rgba(0,0,0,.50);
  --px-paper-bg:#FFFFFF;--px-paper-fg:#1A1A1A;
  --px-selection-bg:rgba(217,56,81,.30);
}

/* ════════════════════════════════════════════════════════════════════
   基础 & 外壳
   ════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--px-font-sans);font-size:var(--px-text-base);
  color:var(--px-fg-primary);background:var(--px-bg-canvas);
  -webkit-font-smoothing:antialiased;letter-spacing:.01em;
}
::selection{background:var(--px-selection-bg)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:var(--px-text-base);color:var(--px-fg-primary);
  background:var(--px-bg-surface);border:1px solid var(--px-input-border,var(--px-border-default));
  border-radius:var(--px-radius-sm);height:var(--px-control-h-md);padding:0 10px;outline:none;transition:border-color var(--px-dur-1),box-shadow var(--px-dur-1)}
input:focus,select:focus,textarea:focus{box-shadow:var(--px-focus-ring);border-color:var(--px-accent-bg)}
input[type=color]{padding:2px;width:100%}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--px-accent-bg);flex:0 0 auto}

/* ── AppRail ── */
.app-shell{display:flex;min-height:100vh;align-items:stretch}
.app-rail{position:sticky;top:0;align-self:flex-start;height:100vh;flex:0 0 auto;width:var(--px-rail-w);background:var(--px-bg-surface);border-right:1px solid var(--px-border-subtle);
  display:flex;flex-direction:column;padding:var(--px-space-4) var(--px-space-3);transition:width var(--px-dur-2) var(--px-ease-out),padding var(--px-dur-2) var(--px-ease-out)}
/* 内层容器承担裁切：随栏宽变化平滑揭示/隐藏标签，避免标签溢出到内容区造成重排 */
.rail-inner{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden}
.rail-handle{position:absolute;right:-12px;top:50%;transform:translateY(-50%);z-index:50;
  width:24px;height:24px;border-radius:50%;border:1px solid var(--px-border-default);
  background:var(--px-bg-surface);color:var(--px-fg-secondary);display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--px-shadow-2);transition:border-color var(--px-dur-1),color var(--px-dur-1),background var(--px-dur-1),transform var(--px-dur-2)}
.rail-handle:hover{border-color:var(--px-border-strong);color:var(--px-fg-primary);background:var(--px-bg-subtle)}
.rail-handle svg{width:14px;height:14px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--px-border-subtle);margin-bottom:10px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--px-accent-bg);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto}
.brand-text{line-height:1.2;overflow:hidden}
.brand .name{font-weight:700;font-size:15px}
.brand .sub{font-size:11px;color:var(--px-fg-tertiary)}
.rail-nav{display:flex;flex-direction:column;gap:2px;flex:1}
.rail-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--px-radius-md);
  color:var(--px-fg-secondary);font-size:14px;font-weight:500;border-left:3px solid transparent;text-decoration:none;user-select:none;position:relative}
.rail-item:hover{background:var(--px-bg-subtle);color:var(--px-fg-primary)}
.rail-item.active{background:var(--px-accent-soft);color:var(--px-accent-fg);border-left-color:var(--px-accent-bg);font-weight:600}
.rail-item .ic{width:18px;height:18px;flex:0 0 auto;display:inline-block}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--px-border-subtle)}
.rail-user{display:flex;align-items:center;gap:10px;padding:0 2px}
.rail-avatar{width:30px;height:30px;border-radius:50%;background:var(--px-accent-soft);color:var(--px-accent-fg);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:0 0 auto}
.rail-user-text{display:flex;flex-direction:column;gap:1px;line-height:1.25;overflow:hidden}
.rail-user-text b{font-size:13px;font-weight:600;color:var(--px-fg-primary)}
.rail-user-text span{font-size:11px;color:var(--px-fg-tertiary)}
.rail-theme{display:flex;align-items:center;justify-content:center;padding:0}
.rail-theme svg,.theme-icon{width:18px;height:18px;flex:0 0 auto}
/* 折叠文本：用 max-width/max-height+opacity 过渡。折叠时尺寸与高度归零，既不占布局把图标挤偏，也不撑高导致下方内容下移 */
.brand-text,.rail-item .label,.rail-user-text,.rail-theme span{max-width:240px;max-height:60px;opacity:1;overflow:hidden;white-space:nowrap;transition:max-width var(--px-dur-2) var(--px-ease-out),max-height var(--px-dur-2) var(--px-ease-out),opacity var(--px-dur-2) var(--px-ease-out)}
.rail-item .label,.rail-theme span{display:inline-block;vertical-align:middle}

/* 删除按钮统一红色 */
.chip-actions button.danger,.question-editor-title button.qe-trash,.bl-trash{color:var(--px-danger-fg)}
.chip-actions button.danger:hover,.question-editor-title button.qe-trash:hover,.bl-trash:hover{background:var(--px-danger-soft)}

/* 侧边栏收起态 */
.app-shell.rail-collapsed .app-rail{padding-left:10px;padding-right:10px;width:var(--px-rail-collapsed-w)}
.app-shell.rail-collapsed .rail-handle svg{transform:rotate(180deg)}
.app-shell.rail-collapsed .brand{justify-content:center;padding-left:0;padding-right:0;border-bottom-color:transparent;gap:0}
.app-shell.rail-collapsed .brand-text{max-width:0;max-height:0;opacity:0}
.app-shell.rail-collapsed .rail-item{justify-content:center;padding-left:0;padding-right:0;gap:0}
.app-shell.rail-collapsed .rail-item .label{max-width:0;max-height:0;opacity:0}
.app-shell.rail-collapsed .rail-user-text{max-width:0;max-height:0;opacity:0}
.app-shell.rail-collapsed .rail-user{justify-content:center;padding:0;gap:0}
.app-shell.rail-collapsed .rail-theme{gap:0}
.app-shell.rail-collapsed .rail-theme span{max-width:0;max-height:0;opacity:0}

/* ── Designer 主体 ── */
.designer{display:flex;flex-direction:column;min-width:0;height:100vh}
.designer-topbar{height:var(--px-page-header-h);flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:0 var(--px-space-5);border-bottom:1px solid var(--px-border-subtle);background:var(--px-bg-surface)}
.designer-topbar .title{font-size:var(--px-text-xl);font-weight:600}
.designer-topbar .sub{font-size:12px;color:var(--px-fg-tertiary);margin-left:2px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.designer-body{flex:1 1 auto;display:grid;grid-template-columns:var(--px-context-panel-w) 1fr 360px;grid-template-rows:auto}

/* ── ContextPanel ── */
.context-panel{background:var(--px-bg-surface);border-right:1px solid var(--px-border-subtle);
  display:flex;flex-direction:column;overflow:visible}
.ctx-section{padding:var(--px-space-4);border-bottom:1px solid var(--px-border-subtle)}
.ctx-section h4{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--px-fg-tertiary);letter-spacing:.04em;text-transform:uppercase}
.card-list{display:flex;flex-direction:column;gap:6px}
.card-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--px-radius-md);
  border:1px solid var(--px-border-default);background:var(--px-bg-surface);cursor:pointer;transition:border-color var(--px-dur-1),background var(--px-dur-1)}
.card-row:hover{border-color:var(--px-border-strong)}
.card-row.active{border-color:var(--px-accent-bg);background:var(--px-accent-soft)}
.card-row .ci{flex:1 1 auto;min-width:0}
.card-row .ci .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-row .ci .m{font-size:11px;color:var(--px-fg-tertiary);margin-top:2px}
.card-row .del{color:var(--px-fg-tertiary);border:none;background:none;padding:4px;border-radius:6px}
.card-row .del:hover{color:var(--px-danger-fg);background:var(--px-danger-soft)}

.block-list{display:flex;flex-direction:column;gap:6px}
.block-chip{border:1px solid var(--px-border-default);border-radius:var(--px-radius-md);overflow:hidden;background:var(--px-bg-surface)}
.block-chip.active{border-color:var(--px-accent-bg);box-shadow:inset 3px 0 0 var(--px-accent-bg)}
.block-chip .bc-head{display:flex;align-items:center;gap:8px;padding:8px 10px}
.block-chip .bc-head button.bc-select{flex:1 1 auto;text-align:left;background:none;border:none;padding:0;display:flex;flex-direction:column;gap:1px;min-width:0}
.block-chip .bc-head strong{font-size:13px}
.block-chip .bc-head span{font-size:11px;color:var(--px-fg-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-chip .chip-actions{display:flex;gap:2px;flex:0 0 auto}
.chip-actions button{border:none;background:none;color:var(--px-fg-tertiary);width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.chip-actions button:hover{background:var(--px-bg-subtle);color:var(--px-fg-primary)}
.chip-actions button:disabled{opacity:.3;cursor:not-allowed}
.split-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}

/* ── Canvas ── */
.canvas{display:flex;flex-direction:column;min-width:0;background:var(--px-bg-canvas)}
.preview-toolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--px-border-subtle);background:var(--px-bg-surface);flex:0 0 auto}
.preview-toolbar button{border:1px solid var(--px-border-default);background:var(--px-bg-surface);color:var(--px-fg-secondary);
  height:30px;padding:0 10px;border-radius:var(--px-radius-sm);font-size:12px}
.preview-toolbar button:hover{border-color:var(--px-border-strong);color:var(--px-fg-primary)}
.preview-toolbar button.active{background:var(--px-accent-soft);color:var(--px-accent-fg);border-color:var(--px-accent-border)}
.preview-toolbar .sep{width:1px;height:18px;background:var(--px-border-default);margin:0 4px}
.preview-toolbar output{font-variant-numeric:tabular-nums;font-size:12px;color:var(--px-fg-secondary);min-width:42px;text-align:center}
.preview-toolbar .spacer{margin-left:auto;font-size:12px;color:var(--px-fg-tertiary)}
.pages-wrap{flex:1 1 auto;overflow:visible;padding:24px;display:flex;flex-direction:column;align-items:center;gap:24px;
  background:var(--px-bg-canvas)}
.pages{display:flex;flex-direction:column;gap:24px;align-items:center}
.page{background:var(--px-paper-bg);box-shadow:var(--px-shadow-2);border-radius:2px}
.warn-panel{border:1px solid var(--px-warning-border);background:var(--px-warning-soft);color:var(--px-warning-fg);
  border-radius:var(--px-radius-md);padding:10px 12px;margin:0 12px 12px;font-size:12px}
.warn-panel p{margin:2px 0}
.blank-preview{padding:40px;color:var(--px-fg-tertiary);text-align:center}

/* SVG 文本类 */
.svg-small{font-size:3px;fill:var(--px-paper-fg)}
.svg-title{font-size:5px;fill:var(--px-paper-fg);font-weight:700}
.svg-section{font-size:3.4px;fill:var(--px-paper-fg);font-weight:600}
.svg-label{font-size:2.6px;fill:var(--px-paper-fg)}
.svg-tiny{font-size:2.4px;fill:var(--px-paper-fg)}
.svg-option-label{font-size:2.6px;fill:var(--px-paper-fg)}
.svg-footer{font-size:3px;fill:var(--px-paper-fg)}
.svg-blank-label{font-size:2.4px;fill:var(--px-paper-fg)}

/* ── Inspector ── */
.inspector{background:var(--px-bg-surface);border-left:1px solid var(--px-border-subtle);
  overflow:visible;padding:var(--px-space-4);display:flex;flex-direction:column;gap:var(--px-space-4)}
.panel{border:1px solid var(--px-border-default);border-radius:var(--px-radius-lg);background:var(--px-bg-surface);overflow:hidden}
.panel>.panel-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--px-border-subtle)}
.section-title{font-size:13px;font-weight:600;margin:0 0 6px;color:var(--px-fg-primary)}
.panel .panel-body{padding:12px;display:flex;flex-direction:column;gap:10px}
.empty-text{color:var(--px-fg-tertiary);font-size:13px;text-align:center;padding:24px}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--px-fg-secondary)}
label .rowval{color:var(--px-fg-primary);font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.check-row{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:12px;color:var(--px-fg-secondary)}
.check-row input{margin:0}
.hint{font-size:11px;color:var(--px-fg-tertiary);line-height:1.5;background:var(--px-bg-subtle);border-radius:var(--px-radius-sm);padding:8px 10px}
.inline-warning{font-size:11px;color:var(--px-warning-fg);background:var(--px-warning-soft);border:1px solid var(--px-warning-border);border-radius:var(--px-radius-sm);padding:6px 8px;margin:0}
.layout-version-banner{border:1px solid var(--px-info-border);background:var(--px-info-soft);color:var(--px-info-fg);
  border-radius:var(--px-radius-md);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.layout-version-banner strong{font-size:12px}

/* 按钮 */
.btn{border:1px solid var(--px-border-default);background:var(--px-bg-surface);color:var(--px-fg-primary);
  height:var(--px-control-h-md);padding:0 12px;border-radius:var(--px-radius-md);font-size:13px;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:background var(--px-dur-1),border-color var(--px-dur-1)}

<script>
/* ════════════════════════════════════════════════════════════════════
   1) 评分 helper（移植自 shared/grading.ts）
   ════════════════════════════════════════════════════════════════════ */
const OPTION_LABELS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const Grading = (() => {
  function normalizeOptions(options, optionCount){
    const allowed = new Set(OPTION_LABELS.slice(0, optionCount ?? OPTION_LABELS.length));
    return Array.from(new Set((options ?? []).map(o=>o.toUpperCase()).filter(o=>allowed.has(o)))).sort();
  }
  function normalizeQuestionConfig(block, config){
    return {
      questionNumber: config.questionNumber,
      mode: config.mode ?? block.mode,
      optionCount: config.optionCount ?? block.optionCount,
      score: config.score ?? block.scorePerQuestion,
      answerKey: config.answerKey ?? block.answerKey?.[config.questionNumber],
      scoringRule: config.scoringRule ?? legacyScoringRule(block),
      optionLayout: config.optionLayout ?? block.optionLayout ?? "horizontal"
    };
  }
  function legacyScoringRule(block){
    if(!block.multipleScoring) return undefined;
    return { type:"per_selected_count", partialScores: block.multipleScoring.partialScores ?? {}, wrongOrExtraScore: block.multipleScoring.wrongOrExtraScore ?? 0 };
  }
  function objectiveQuestionDefinitions(block){
    if(block.questions && block.questions.length>0){
      return block.questions.map(q=>normalizeQuestionConfig(block,q));
    }
    return Array.from({length:block.questionCount},(_,i)=>{
      const questionNumber = block.questionStart + i;
      return normalizeQuestionConfig(block,{questionNumber});
    });
  }
  function objectiveQuestionNumbers(block){ return objectiveQuestionDefinitions(block).map(q=>q.questionNumber); }
  function optionLabelsForQuestion(block, questionNumber){
    const def = objectiveQuestionDefinitions(block).find(q=>q.questionNumber===questionNumber);
    return OPTION_LABELS.slice(0, def?.optionCount ?? block.optionCount);
  }
  function normalizeObjectiveAnswerKey(block){
    const normalized = {};
    for(const q of objectiveQuestionDefinitions(block)){
      const options = normalizeOptions(q.answerKey, q.optionCount);
      if(q.mode==="single" && options.length>1){ normalized[q.questionNumber]=[options[0]]; }
      else if(options.length>0){ normalized[q.questionNumber]=options; }
    }
    return normalized;
  }
  function normalizeObjectiveQuestions(block){
    const answerKey = normalizeObjectiveAnswerKey(block);
    return objectiveQuestionDefinitions(block).map(q=>{
      const options = normalizeOptions(answerKey[q.questionNumber], q.optionCount);
      return {
        questionNumber:q.questionNumber, mode:q.mode, optionCount:q.optionCount, score:q.score,
        answerKey: q.mode==="single" && options.length>1 ? [options[0]] : options,
        scoringRule: q.scoringRule
      };
    });
  }
  return { normalizeOptions, normalizeQuestionConfig, objectiveQuestionDefinitions, objectiveQuestionNumbers,
    optionLabelsForQuestion, normalizeObjectiveAnswerKey, normalizeObjectiveQuestions };
})();

/* ════════════════════════════════════════════════════════════════════
   2) 填空标签（移植自 shared/blankLabels.ts）
   ════════════════════════════════════════════════════════════════════ */
function romanNumeral(value){
  const numerals=[[50,"l"],[40,"xl"],[10,"x"],[9,"ix"],[5,"v"],[4,"iv"],[1,"i"]];
  let rem=value,res="";
  for(const [amt,lab] of numerals){ while(rem>=amt){ res+=lab; rem-=amt; } }
  return res;
}
function formatBlankLabel(style, index){
  if(!style || style==="none") return "";
  if(style==="roman_parentheses") return "("+romanNumeral(index+1)+")";
  return "("+(index+1)+")";
}

/* ════════════════════════════════════════════════════════════════════
   3) 数据模型 & 默认题块工厂（移植自 client/cardModel.ts）
   ════════════════════════════════════════════════════════════════════ */
const CardModel = (() => {
  let _id = 0;
  function createBlockId(prefix){ _id+=1; return prefix+"_"+Date.now().toString(36)+"_"+_id; }

  const modeLabels = { single:"单选", multiple:"多选", indefinite:"不定项" };
  const optionLayoutLabels = { horizontal:"横向", vertical:"竖向（4题一组）" };
  const styleLabels = { manual_score_grid:"带分数填涂区", plain_subjective:"纯主观题书写块" };
  const kindLabels = { blank:"填空", lined_answer:"横线格", plain_box:"空白大框" };
  const blankLabelStyleLabels = { none:"不带序号", arabic_parentheses:"(1)(2)", roman_parentheses:"(i)(ii)" };

  function subjectiveBlockKind(block){
    if(block.blockKind) return block.blockKind;
    if(block.title.includes("解答")) return "answer";
    if(block.title.includes("作文")) return "essay";
    if(block.questions.length>0 && block.questions.every(q=>q.kind==="blank")) return "fill_blank";
    return "answer";
  }
  function subjectiveBlockKindLabel(block){
    const k = subjectiveBlockKind(block);
    if(k==="fill_blank") return "填空题";
    if(k==="essay") return "作文题";
    return "解答题";
  }
  function answerBlankItems(question){
    const fbW = question.blanks?.widthMm ?? 32;
    const fbH = question.blanks?.heightMm ?? 6;
    if(question.blanks?.items?.length){
      return question.blanks.items.map(it=>({ label:it.label??"", widthMm:it.widthMm||fbW, heightMm:it.heightMm||fbH, rightAnnotation:it.rightAnnotation }));
    }
    const count = Math.max(1, question.blanks?.count ?? 4);
    return Array.from({length:count},(_,i)=>({ label:formatBlankLabel(question.blanks?.labelStyle??"arabic_parentheses",i), widthMm:fbW, heightMm:fbH }));
  }
  function defaultBlankQuestion(qn, score=0, style="plain_subjective"){
    return { id:createBlockId("q"), number:qn, score, style, kind:"blank",
      blanks:{count:1,widthMm:22,heightMm:6,labelStyle:"none"},
      lineGrid:{enabled:false,lineSpacingMm:8,lineColor:"#222",lineWidthMm:0.15,insetLeftMm:8,insetRightMm:6},
      images:[], minHeightMm:14 };
  }
  function defaultObjective(start){
    return { id:createBlockId("obj"), type:"objective", title:"客观题", questionStart:start, questionCount:10,
      optionCount:4, mode:"single", scorePerQuestion:5, density:"compact", optionLayout:"horizontal",
      answerKey:{}, multipleScoring:{ partialScores:{1:2}, wrongOrExtraScore:0 } };
  }
  function defaultSubjective(next){
    return { id:createBlockId("subj"), type:"subjective", blockKind:"answer", title:"解答题",
      questions:[{ id:createBlockId("q"), number:next, score:12, style:"manual_score_grid", kind:"lined_answer",
        lineGrid:{enabled:true,lineSpacingMm:8,fixedLineCount:5,lineColor:"#222",lineWidthMm:0.15,insetLeftMm:8,insetRightMm:6},
        scoreGrid:{enabled:true,strokeColor:"#999",strokeWidthMm:0.15,fillColor:"#fff",fontSize:2.8,dividerColor:"#ccc",dividerWidthMm:0.1,showLabel:true},
        images:[], minHeightMm:54 }] };
  }
  function defaultBlankBlock(next){
    return { id:createBlockId("subj"), type:"subjective", blockKind:"fill_blank", title:"填空题",
      questions:Array.from({length:10},(_,i)=>defaultBlankQuestion(next+i, i===0?15:0, i===0?"manual_score_grid":"plain_subjective")) };
  }
  function defaultEssayBlock(next){
    return { id:createBlockId("subj"), type:"subjective", blockKind:"essay", title:"作文",
      questions:[{ id:createBlockId("q"), number:next, score:60, style:"manual_score_grid", kind:"plain_box",
        lineGrid:{enabled:false,lineSpacingMm:8,lineColor:"#222",lineWidthMm:0.15,insetLeftMm:8,insetRightMm:6},
        images:[], minHeightMm:280,
        essayGrid:{columns:0,rows:0,cellWidthMm:7,cellHeightMm:7,targetChars:600,showTitle:true,lineColor:"#222",lineWidthMm:0.15} }] };
  }
  function defaultAnswerBlankQuestion(next){
    return { ...defaultBlankQuestion(next,12,"manual_score_grid"), minHeightMm:62,
      blanks:{count:4,widthMm:32,heightMm:6,labelStyle:"arabic_parentheses",
        items:Array.from({length:4},(_,i)=>({label:"("+(i+1)+")",widthMm:32,heightMm:6}))} };
  }
  function answerLineCount(q){
    const sp = Math.max(5, q.lineGrid?.lineSpacingMm ?? 8);
    return Math.max(1, Math.min(20, Math.ceil((q.minHeightMm-14)/sp)));
  }
  function heightForAnswerLines(lineCount, spacing){
    return 14 + Math.max(1,Math.min(20,lineCount))*Math.max(5,spacing);
  }
  function numericQuestionValue(v){ const p=parseInt(String(v),10); return Number.isFinite(p)?p:0; }
  function findNextQuestionNumber(card){
    let max=0;
    for(const b of card.bodyBlocks){
      if(b.type==="objective") max=Math.max(max, b.questionStart + b.questionCount -1);
      if(b.type==="subjective"){ for(const q of b.questions) max=Math.max(max, numericQuestionValue(q.number)); }
    }
    return max+1;
  }
  return { createBlockId, modeLabels, optionLayoutLabels, styleLabels, kindLabels, blankLabelStyleLabels,
    subjectiveBlockKind, subjectiveBlockKindLabel, answerBlankItems, defaultObjective, defaultSubjective,
    defaultBlankBlock, defaultEssayBlock, defaultAnswerBlankQuestion, defaultBlankQuestion,
    answerLineCount, heightForAnswerLines, numericQuestionValue, findNextQuestionNumber };
})();

/* ════════════════════════════════════════════════════════════════════
   4) 布局引擎（忠实移植自 shared/layout.ts）
   ════════════════════════════════════════════════════════════════════ */
const Layout = (() => {
  let PAGE_WIDTH=210, PAGE_HEIGHT=297;
  const OUTER_MARGIN_X=17;
  let MARGIN_X=OUTER_MARGIN_X;
  const TOP_MARGIN=14, BOTTOM_MARGIN=18;
  let BODY_WIDTH=PAGE_WIDTH-MARGIN_X*2;
  const A3_PANEL_GAP=8;
  let IS_A3=false, IS_LAYOUT_V2=false;
  let ACTIVE_WARNINGS=[];
  const OPTIONS=OPTION_LABELS;
  const DENSITY={
    loose:{maxColumns:4,rowHeight:7.7,optionGap:8.1,optionWidth:5.1,optionHeight:3.0,questionGap:6.4},
    normal:{maxColumns:4,rowHeight:6.7,optionGap:7.4,optionWidth:4.8,optionHeight:2.8,questionGap:5.6},
    compact:{maxColumns:5,rowHeight:5.9,optionGap:6.7,optionWidth:4.4,optionHeight:2.5,questionGap:4.8},
    dense:{maxColumns:6,rowHeight:5.2,optionGap:6.0,optionWidth:4.1,optionHeight:2.3,questionGap:4.2}
  };
  const OBJECTIVE_SETTINGS=DENSITY.compact;
  const OBJECTIVE_FRAME_TOP=6.2, OBJECTIVE_INNER_TOP=2.4, OBJECTIVE_INNER_BOTTOM=2.2;
  const OBJECTIVE_ROW_MARKER_SIZE=2.2, OBJECTIVE_OPTION_TOP_OFFSET=0.9, OBJECTIVE_CONTENT_SIDE_INSET=8.5;
  const OBJECTIVE_LABEL_TO_OPTION_GAP=6.3;
  let OBJECTIVE_STANDARD_COLUMNS=4;
  const OBJECTIVE_GRID_CELL_QUESTIONS=5, OBJECTIVE_VERTICAL_GROUP_QUESTIONS=4, OBJECTIVE_WIDE_OPTION_THRESHOLD=5, OBJECTIVE_GRID_ROW_GAP=1.5;
  function rect(x,y,w,h){ return {x:round(x),y:round(y),width:round(w),height:round(h)}; }
  function round(v){ return Math.round(v*1000)/1000; }
  function markerRects(){
    const w=2.6;
    const hFor=r=>{ if(!IS_A3) return 7; if(r==="middle") return 5.5; if(r==="bottom") return 9; return 7; };
    return [
      {role:"top-left",rect:rect(OUTER_MARGIN_X-4.5,21,w,hFor("top"))},
      {role:"top-right",rect:rect(PAGE_WIDTH-OUTER_MARGIN_X+1.9,21,w,hFor("top"))},
      {role:"middle-left",rect:rect(OUTER_MARGIN_X-4.5,163,w,hFor("middle"))},

})();

            <button data-insert="${b.id}" title="在后面插入客观题">＋</button>
            <button data-rm="${b.id}" class="danger" title="删除">${TRASH_ICON}</button>
          </div></div></div>`;
      }).join("");
    }
    el.innerHTML=`
      <div class="ctx-section" style="flex:1 1 auto">
        <h4>正文题块</h4>
        <div class="block-list">${blockList||'<div class="empty-text">请先新建答题卡</div>'}</div>
        <div class="split-actions">
          <button class="btn ghost sm" data-add="objective">客观题块</button>
          <button class="btn ghost sm" data-add="blank">填空题块</button>
          <button class="btn ghost sm" data-add="subjective">解答题块</button>
          <button class="btn ghost sm" data-add="essay">作文块</button>
        </div>
      </div>`;
    bindContext();
  }
  function bindContext(){
    const el=document.getElementById("contextPanel");
    el.querySelectorAll("[data-block]").forEach(b=>b.onclick=()=>{ selectedBlockId=b.getAttribute("data-block"); rerender(); });
    el.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{ const id=b.getAttribute("data-move"); const dir=Number(b.getAttribute("data-dir")); moveBlock(id,dir); });
    el.querySelectorAll("[data-insert]").forEach(b=>b.onclick=()=>{ const id=b.getAttribute("data-insert"); const idx=card().bodyBlocks.findIndex(x=>x.id===id); addBlock("objective",idx); });
    el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ removeBlock(b.getAttribute("data-rm")); });
    el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ addBlock(b.getAttribute("data-add")); });
  }

  /* ── 两级流程：第一级「选择画廊」── */
  function miniThumb(c){
    try{
      const lay=Layout.buildLayout(c);
      if(!lay||!lay.pages.length) return '<div class="ct-thumb-empty">空白卡</div>';
      return Svg.pageSvg(c, lay.pages[0], lay.pages.length);
    }catch{ return '<div class="ct-thumb-empty">—</div>'; }
  }
  function questionCount(c){
    return c.bodyBlocks.reduce((s,b)=> s + (b.type==="objective"? (b.questionCount||0) : (b.questions?b.questions.length:0)), 0);
  }
  function blockKinds(c){
    return [...new Set(c.bodyBlocks.map(b=> b.type==="objective"?"客观题":CardModel.subjectiveBlockKindLabel(b)))];
  }
  function renderSelect(){
    const el=document.getElementById("selectStage");
    const tiles = cards.map(c=>`<div class="card-tile ${c.id===activeCardId?"active":""}" data-card="${c.id}" tabindex="0">
        <div class="ct-thumb">${miniThumb(c)}</div>
        <div class="ct-meta">
          <div class="ct-title">${esc(c.title)}</div>
          <div class="ct-sub">${esc(c.subjectLabel||"未设科目")} · ${c.paper?.size||"A4"} · V${c.layoutVersion}</div>
          <div class="ct-stats">${c.bodyBlocks.length} 题块 · 约 ${questionCount(c)} 题${blockKinds(c).length?" · "+blockKinds(c).join("/"):""}</div>
        </div>
      </div>`).join("");
    el.innerHTML=`
      <div class="select-head">
        <div><h2>答题卡</h2><p class="muted">选择一张已有答题卡进行编辑，或新建一张。</p></div>
        <button class="btn primary" id="selectNewBtn">＋ 新建答题卡</button>
      </div>
      <div class="card-grid">
        ${tiles || '<div class="empty-grid">还没有答题卡，点击右上角「新建答题卡」开始。</div>'}
        <div class="card-tile new-tile" id="selectNewTile"><div class="nt-plus">＋</div><div>新建答题卡</div></div>
      </div>`;
    bindSelect();
  }
  function bindSelect(){
    const el=document.getElementById("selectStage");
    el.querySelectorAll("[data-card]").forEach(n=>{
      n.onclick=()=>enterEditor(n.getAttribute("data-card"));
      n.oncontextmenu=(e)=>{ showCardCtxMenu(e,n.getAttribute("data-card")); return false; };
    });
    document.getElementById("selectNewTile").onclick=()=>createAndEnter();
    const nb=document.getElementById("selectNewBtn"); if(nb) nb.onclick=()=>createAndEnter();
  }
  function createAndEnter(){ const c=newCard("未命名答题卡"); cards.push(c); enterEditor(c.id); toast("已新建空白答题卡"); }
  function showCardCtxMenu(e,id){
    const menu=document.getElementById("cardCtxMenu");
    menu.style.display="block";
    const x=Math.min(e.clientX, window.innerWidth-menu.offsetWidth-8);
    const y=Math.min(e.clientY, window.innerHeight-menu.offsetHeight-8);
    menu.style.left=x+"px"; menu.style.top=y+"px";
    menu._cardId=id;
  }
  function hideCardCtxMenu(){ document.getElementById("cardCtxMenu").style.display="none"; }
  document.addEventListener("click", hideCardCtxMenu);
  function enterEditor(id){
    activeCardId=id; const c=card(); selectedBlockId=c&&c.bodyBlocks[0]?c.bodyBlocks[0].id:null;
    recompute(); setScreen("editor");
  }
  function goSelect(){ setScreen("select"); }
  function setScreen(name){
    screen=name;
    const sel=document.getElementById("selectStage"), edt=document.getElementById("editorStage");
    if(name==="select"){ sel.style.display="flex"; edt.style.display="none"; renderSelect(); }
    else { sel.style.display="none"; edt.style.display="flex"; renderAll(); measure(); }
  }

  /* ── 画布（预览）── */
  function renderCanvas(){
    const el=document.getElementById("canvas");
    const c=card();
    if(!c||!layout){ el.innerHTML=`<div class="blank-preview">选择或新建答题卡</div>`; return; }
    const firstPage=layout.pages[0];
    const paperRatio=firstPage.width/firstPage.height;
    const panelRatio=firstPage.panels[0].rect.width?firstPage.width/firstPage.panels[0].rect.width:1;
    const fitPage=Math.max(PREVIEW_MIN,Math.min(100,viewport.height*paperRatio/viewport.width*100));
    const eff=Math.max(PREVIEW_MIN,Math.min(PREVIEW_MAX,
      preview.mode==="fit-page"?fitPage:preview.mode==="fit-panel"?panelRatio*100:preview.mode==="custom"?preview.customPercent:100));
    const pageWidthPx=viewport.width*eff/100;
    const warns=layout.warnings.length?`<div class="warn-panel">${layout.warnings.map(w=>`<p>⚠ ${esc(w)}</p>`).join("")}</div>`:"";
    const pages=layout.pages.map(p=>Svg.pageSvg(c,p,layout.pages.length)).join("");
    el.innerHTML=`
      <div class="preview-toolbar">
        <button class="${preview.mode==="fit-width"?"active":""}" data-pm="fit-width">适合宽度</button>
        <button class="${preview.mode==="fit-page"?"active":""}" data-pm="fit-page">适合页面</button>
        <button class="${preview.mode==="fit-panel"?"active":""}" data-pm="fit-panel">适合单版</button>
        <span class="sep"></span>
        <button data-zoom="-10" ${eff<=PREVIEW_MIN?"disabled":""}>−</button>
        <output>${Math.round(eff)}%</output>
        <button data-zoom="10" ${eff>=PREVIEW_MAX?"disabled":""}>＋</button>
        <span class="spacer">${c.paper?.size==="A3"?"A3 横向三版":"A4 纵向"} · 共 ${layout.pages.length} 页</span>
      </div>
      ${warns}
      <div class="pages-wrap"><div class="pages" style="width:${Math.max(pageWidthPx,120)}px">${pages}</div></div>`;
    el.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{ preview.mode=b.getAttribute("data-pm"); savePreview(); rerender(); });
    el.querySelectorAll("[data-zoom]").forEach(b=>b.onclick=()=>{ const d=Number(b.getAttribute("data-zoom")); preview.customPercent=Math.max(PREVIEW_MIN,Math.min(PREVIEW_MAX,Math.round(eff/10)*10+d)); preview.mode="custom"; savePreview(); rerender(); });
  }

  /* ── 检查器 ── */
  function renderInspector(){
    const el=document.getElementById("inspector");
    const c=card();
    if(!c){ el.innerHTML=`<div class="empty-text">请新建或载入答题卡。</div>`; return; }
    const b=selectedBlock();
    let editor="";
    if(b){ editor = b.type==="objective"?objectiveEditor(b):subjectiveEditor(b,c.layoutVersion); }
    const warnPanel = layout&&layout.warnings.length?`<details class="panel"><summary>排版警告<span class="chev">▶</span></summary><div class="panel-body">${layout.warnings.map(w=>`<p class="inline-warning">${esc(w)}</p>`).join("")}</div></details>`:"";
    el.innerHTML=`
      ${basicInfo(c)}
      <div class="panel"><div class="panel-title">正文题块</div><div class="panel-body">${blockMiniList(c)}</div></div>
      ${editor?`<div class="panel"><div class="panel-title">选中块设置</div><div class="panel-body">${editor}</div></div>`:""}
      ${warnPanel}`;
    bindInspector(c);
  }
  function blockMiniList(c){
    return c.bodyBlocks.map(b=>`<div class="block-chip ${b.id===selectedBlockId?"active":""}" style="margin-bottom:6px"><div class="bc-head"><button class="bc-select" data-block="${b.id}"><strong>${b.type==="objective"?"客观题":CardModel.subjectiveBlockKindLabel(b)}</strong><span>${esc(b.title)}</span></button></div></div>`).join("")||'<div class="empty-text">暂无题块</div>';
  }
  function basicInfo(c){
    const v1banner = c.layoutVersion!==2?`<div class="layout-version-banner"><strong>当前使用 V1 兼容排版</strong><span>旧打印件仍按原分数格坐标识别。升级后将使用紧凑分数区和更大的作答空间。</span><button class="btn ghost sm" data-upgrade="1">升级到紧凑排版 V2</button></div>`:"";
    return `<div class="panel"><div class="panel-title">基本信息</div><div class="panel-body">
      <label>标题<input data-ci="title" value="${esc(c.title)}"></label>
      ${c.subjectLabel?`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--px-fg-secondary)"><span>科目</span><span style="font-weight:600;color:var(--px-fg-primary)">${esc(c.subjectLabel)}</span></div>`:""}
      ${c.examDate?`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--px-fg-secondary)"><span>考试时间</span><span style="font-weight:600;color:var(--px-fg-primary)">${esc(c.examDate)}</span></div>`:""}
      <label>答题卡纸型<select data-ci="paper.size"><option value="A4" ${c.paper?.size==="A4"?"selected":""}>A4 纵向</option><option value="A3" ${c.paper?.size==="A3"?"selected":""}>A3 横向三版</option></select></label>
      ${v1banner}
      <label>学号位数<input type="number" min="1" max="12" data-ci="studentInfo.studentNumberDigits" value="${c.studentInfo.studentNumberDigits}"></label>
      <label>答题卡面<select data-ci="sided"><option value="single" ${c.sided==="single"?"selected":""}>单面（仅正面有题）</option><option value="double" ${c.sided==="double"?"selected":""}>双面（正反面均有题）</option></select></label>
    </div></div>`;
  }

  /* 客观题编辑器 */
  function objectiveEditor(b){
    const questions=Grading.objectiveQuestionDefinitions(b);
    const answerKey=Grading.normalizeObjectiveAnswerKey(b);
    const missing=questions.filter(q=>!answerKey[q.questionNumber]?.length).length;
    const rows=questions.map(q=>{
      const opts=Grading.optionLabelsForQuestion(b,q.questionNumber).map(op=>{
        const active=answerKey[q.questionNumber]?.includes(op)??false;
        return `<button class="${active?"active":""}" data-ans="${q.questionNumber}" data-opt="${op}">${op}</button>`;
      }).join("");
      return `<div class="answer-key-row"><span>${q.questionNumber}</span><div>${opts}</div></div>`;
    }).join("");
    const perQ = questions.map(q=>{
      const rule = q.scoringRule ?? {type:"per_selected_count",partialScores:{},wrongOrExtraScore:0};
      let scoring="";
      if(q.mode!=="single"){
        const type=rule.type||"per_selected_count";
        let body="";
        if(type==="fixed_partial"){ body=`<label>少选固定得分<input type="number" step="0.5" data-qrule="${q.questionNumber}" data-rk="fixedPartial" value="${rule.partialScore??0}"></label>`; }
        else if(type==="by_correct_count"){
          body=`<div style="display:flex;flex-direction:column;gap:8px">`+Array.from({length:Math.max(0,q.optionCount-1)},(_,i)=>i+2).map(cc=>{
            return `<div style="display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center"><span style="font-size:12px;color:var(--px-fg-secondary)">${cc} 个答案</span><div class="three-col">`+Array.from({length:cc-1},(_,i)=>i+1).map(sc=>`<label>${sc} 项对<input type="number" step="0.5" data-bycorrect="${q.questionNumber}" data-cc="${cc}" data-sc="${sc}" value="${rule.partialScoresByCorrectCount?.[cc]?.[sc]??0}"></label>`).join("")+`</div></div>`;
          }).join("")+`</div>`;
        } else {
          body=`<div class="three-col">`+Array.from({length:Math.max(1,q.optionCount-1)},(_,i)=>i+1).map(sc=>`<label>选对 ${sc} 项<input type="number" step="0.5" data-perselected="${q.questionNumber}" data-sc="${sc}" value="${rule.partialScores?.[sc]??0}"></label>`).join("")+`</div>`;
        }
        scoring=`<div class="two-col">
          <label>少选计分方式<select data-scoringtype="${q.questionNumber}">
            <option value="per_selected_count" ${type==="per_selected_count"?"selected":""}>按选对项数给分</option>
            <option value="by_correct_count" ${type==="by_correct_count"?"selected":""}>按正确答案数量给分</option>
            <option value="fixed_partial" ${type==="fixed_partial"?"selected":""}>少选固定分</option></select></label>
          <label>错选/多选/不选得分<input type="number" step="0.5" data-wrongextra="${q.questionNumber}" value="${rule.wrongOrExtraScore??0}"></label></div>${body}
          <label class="check-row"><input type="checkbox" data-allowwrong="${q.questionNumber}" ${rule.allowWrongOptions===true?"checked":""}>错选但未超过正确答案数时，只按选对项给分</label>`;
      }
      return `<div class="question-editor"><div class="question-editor-title"><strong>第 ${q.questionNumber} 题</strong></div>
        <div class="three-col">
          <label>题号<input type="number" min="1" data-qnum="${q.questionNumber}" value="${q.questionNumber}"></label>
          <label>题型<select data-qmode="${q.questionNumber}">${Object.entries(CardModel.modeLabels).map(([v,l])=>`<option value="${v}" ${q.mode===v?"selected":""}>${l}</option>`).join("")}</select></label>
          <label>选项数<input type="number" min="2" max="8" data-qopt="${q.questionNumber}" value="${q.optionCount}"></label>
        </div>
        <label>分值<input type="number" min="0" step="0.5" data-opscore="${q.questionNumber}" value="${q.score}"></label>
        ${scoring}</div>`;
    }).join("");

    return `<div class="section-title">客观题机器阅卷块</div>
      <label>标题<input data-bf="title" value="${esc(b.title)}"></label>
      <div class="answer-key-editor">
        <div class="answer-key-title"><strong>标准答案</strong><span>${missing===0?"已全部配置":missing+" 题未配置"}</span></div>
        <div class="answer-key-grid">${rows}</div>
      </div>
      <div class="two-col">
        <label>起始题号<input type="number" min="1" data-bf="questionStart" value="${b.questionStart}"></label>
        <label>题目数<input type="number" min="1" max="120" data-bf="questionCount" value="${b.questionCount}"></label>
      </div>
      <div class="two-col">
        <label>选项数<input type="number" min="2" max="8" data-bf="optionCount" value="${b.optionCount}"></label>
        <label>每题分值<input type="number" min="0" step="0.5" data-bf="scorePerQuestion" value="${b.scorePerQuestion}"></label>
      </div>
      <div class="two-col">
        <label>题型<select data-bf="mode">${Object.entries(CardModel.modeLabels).map(([v,l])=>`<option value="${v}" ${b.mode===v?"selected":""}>${l}</option>`).join("")}</select></label>
        <label>选项排列<select data-bf="optionLayout">${Object.entries(CardModel.optionLayoutLabels).map(([v,l])=>`<option value="${v}" ${b.optionLayout===v?"selected":""}>${l}</option>`).join("")}</select></label>
      </div>
      <div class="two-col">
        <label>少选1项得分<input type="number" step="0.5" data-bf="ms1" value="${b.multipleScoring?.partialScores?.[1]??0}"></label>
        <label>多选/错选得分<input type="number" step="0.5" data-bf="msWrong" value="${b.multipleScoring?.wrongOrExtraScore??0}"></label>
      </div>
      <div style="margin-top:8px"><button class="btn ghost sm" data-toggleperq>展开每题配置</button></div>
      <div data-perq style="display:none">
        <div class="answer-key-editor"><div class="answer-key-title"><strong>每题配置</strong><span>可混排单选、多选、不定项</span></div>
        <div style="display:flex;flex-direction:column;gap:10px">${perQ}</div></div>
      </div>
      <p class="hint">横向模式少于 15 题按行排列、15 题及以上按 5 题小组网格排列；竖向模式按高考 AB 卡式 4 题一组纵向排布。超过 5 个选项的题目独占一行。</p>`;
  }

  /* 主观题编辑器 */
  function subjectiveEditor(b,layoutVersion){
    const isFill=CardModel.subjectiveBlockKind(b)==="fill_blank";
    const isEssay=CardModel.subjectiveBlockKind(b)==="essay";
    let head=`<div class="section-title">${isFill?"填空题块":isEssay?"作文块":"解答题块"}</div>
      <label>标题<input data-bf="title" value="${esc(b.title)}"></label>`;
    if(isFill){
      head+=`<label>填空题块满分<input type="number" min="0" max="60" step="0.5" data-fillscore value="${b.questions[0]?.score??0}"></label>`;
      if(layoutVersion===2 && (b.questions[0]?.score??0)<=0) head+=`<p class="inline-warning">满分为 0，V2 不会生成分数填涂格。请先设置满分。</p>`;
    }
    const qs=b.questions.map(q=>questionEditor(b,q,layoutVersion,isFill)).join("");
    let footer="";
    if(isFill){ footer=`<button class="btn ghost sm block" data-addfill>添加填空题</button>`; }
    if(isEssay){ const g=b.questions[0]?.essayGrid||{columns:0,rows:0,cellWidthMm:7,cellHeightMm:7,targetChars:600,showTitle:true,lineColor:"#222",lineWidthMm:0.15};
      footer=`<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <label>目标字数<input type="number" min="100" max="2000" step="50" data-essay="targetChars" value="${g.targetChars??600}"></label>
        <div class="two-col">
          <label>格子宽(mm)<input type="number" min="4" max="12" step="0.5" data-essay="cellWidthMm" value="${g.cellWidthMm??7}"></label>
          <label>格子高(mm)<input type="number" min="4" max="12" step="0.5" data-essay="cellHeightMm" value="${g.cellHeightMm??7}"></label>
        </div>
        <label class="check-row"><input type="checkbox" data-essay="showTitle" ${g.showTitle!==false?"checked":""}>显示"题：（000）"标题</label>
        <div style="font-size:11px;color:var(--px-fg-tertiary)">系统将自动计算每栏列数和行数。A3 三栏模式生效时网格均分到三栏。</div>
      </div>`;
    }
    return head+qs+footer;
  }
  function questionEditor(b,q,layoutVersion,isFill){
    let h=`<div class="question-editor"><div class="question-editor-title"><strong>第 ${esc(q.number)} 题</strong><button data-rmq="${q.id}" class="qe-trash" title="删除小题">${TRASH_ICON}</button></div>`;
    if(layoutVersion===2 && !isFill && q.style==="manual_score_grid" && q.score<=0) h+=`<p class="inline-warning">分值为 0，V2 已隐藏 0/0.5 分数格；设置正分后会自动显示。</p>`;
    h+=`<div class="two-col">`;
    h+=`<label>题号<input data-qn="${q.id}" value="${esc(q.number)}"></label>`;
    if(isFill){ h+=`<label>横线宽(mm)<input type="number" min="8" data-bw="${q.id}" value="${q.blanks?.widthMm??22}"></label>`; }
    else { h+=`<label>分值<input type="number" min="0" step="0.5" data-qscore="${q.id}" value="${q.score}"></label>`; }
    h+=`</div>`;
    if(isFill){
      h+=`<div class="three-col">
        <label>空数<input type="number" min="1" max="8" data-bcount="${q.id}" value="${q.blanks?.count??1}"></label>
        <label>横线高度(mm)<input type="number" min="4" data-bh="${q.id}" value="${q.blanks?.heightMm??6}"></label>
        <label>序号类型<select data-bls="${q.id}">${Object.entries(CardModel.blankLabelStyleLabels).map(([v,l])=>`<option value="${v}" ${q.blanks?.labelStyle===v?"selected":""}>${l}</option>`).join("")}</select></label>
      </div>`;
      h+=`<div class="blank-item-list">`+CardModel.answerBlankItems(q).map((it,bi)=>`<div class="blank-item-row"><label class="full">空${bi+1} 右侧批注<input data-bannot="${q.id}" data-bi="${bi}" value="${esc(it.rightAnnotation||"")}" placeholder="如：填＞或＜"></label></div>`).join("")+`</div>`;
    } else {
      h+=`<label>主观题样式<select data-qstyle="${q.id}">${Object.entries(CardModel.styleLabels).map(([v,l])=>`<option value="${v}" ${q.style===v?"selected":""}>${l}</option>`).join("")}</select></label>`;
      if(q.style==="manual_score_grid"){
        h+=`<div style="border-left:1px solid var(--px-border-default);padding-left:8px;margin:4px 0">
          <label class="check-row"><input type="checkbox" data-scoregrid="${q.id}" ${q.scoreGrid?.enabled!==false?"checked":""}>显示得分填涂格</label>`;
        if(q.scoreGrid?.enabled!==false){
          h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
            <label>格线色<input type="color" data-sg="${q.id}" data-k="strokeColor" value="${q.scoreGrid?.strokeColor??"#999"}"></label>
            <label>分隔线<input type="color" data-sg="${q.id}" data-k="dividerColor" value="${q.scoreGrid?.dividerColor??"#ccc"}"></label>
            <label class="check-row" style="grid-column:1/-1"><input type="checkbox" data-sg="${q.id}" data-k="showLabel" ${q.scoreGrid?.showLabel!==false?"checked":""}>显示"得分"标签</label>
          </div>`;
        }
        h+=`</div>`;
      }
      h+=`<label>作答区类型<select data-qkind="${q.id}">${Object.entries(CardModel.kindLabels).map(([v,l])=>`<option value="${v}" ${q.kind===v?"selected":""}>${l}</option>`).join("")}</select></label>`;
      if(layoutVersion===2 && q.kind==="lined_answer" && q.lineGrid?.enabled){
        h+=`<label>作答行数<input type="number" min="1" max="20" data-linedef="${q.id}" value="${CardModel.answerLineCount(q)}"></label>`;
      } else {
        h+=`<label>最小高度(mm)<input type="number" min="24" max="220" data-qminh="${q.id}" value="${q.minHeightMm}"></label>`;
      }
      if(q.kind==="blank" && !isFill){
        h+=`<div class="blank-item-list">`+CardModel.answerBlankItems(q).map((it,bi)=>`<div class="blank-item-row">
          <label>小题号<input data-blitem="${q.id}" data-bi="${bi}" data-k="label" value="${esc(it.label)}"></label>
          <label>右侧批注<input data-blitem="${q.id}" data-bi="${bi}" data-k="rightAnnotation" value="${esc(it.rightAnnotation||"")}" placeholder="如：填＞或＜"></label>
          <label>宽(mm)<input type="number" min="8" data-blitem="${q.id}" data-bi="${bi}" data-k="widthMm" value="${it.widthMm}"></label>
          <label>高(mm)<input type="number" min="4" data-blitem="${q.id}" data-bi="${bi}" data-k="heightMm" value="${it.heightMm}"></label>
          <button data-blrm="${q.id}" data-bi="${bi}" class="bl-trash" title="删除这个空">${TRASH_ICON}</button>
        </div>`).join("")+`<button class="btn ghost sm" data-bladd="${q.id}">添加空</button></div>`;
      }
      if(!isFill && q.kind!=="blank"){
        h+=`<label class="check-row"><input type="checkbox" data-linegrid="${q.id}" ${q.lineGrid?.enabled?"checked":""}>启用横线格</label>`;
        if(q.lineGrid?.enabled){
          h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
            <label style="grid-column:1/-1">线型<select data-lg="${q.id}" data-k="lineStyle"><option value="solid" ${q.lineGrid.lineStyle==="solid"?"selected":""}>实线</option><option value="dashed" ${q.lineGrid.lineStyle==="dashed"?"selected":""}>虚线</option><option value="dotted" ${q.lineGrid.lineStyle==="dotted"?"selected":""}>点线</option></select></label>
            <label>行数<input type="number" min="1" max="30" data-lg="${q.id}" data-k="fixedLineCount" value="${q.lineGrid.fixedLineCount??CardModel.answerLineCount(q)}"></label>
            <label>间距(mm)<input type="number" min="5" max="16" step="1" data-lg="${q.id}" data-k="lineSpacingMm" value="${q.lineGrid.lineSpacingMm??8}"></label>
            <label>颜色<input type="color" data-lg="${q.id}" data-k="lineColor" value="${q.lineGrid.lineColor??"#222"}"></label>
            <label>线宽(mm)<input type="number" min="0.05" max="0.5" step="0.05" data-lg="${q.id}" data-k="lineWidthMm" value="${q.lineGrid.lineWidthMm??0.15}"></label>
            <label>左边距(mm)<input type="number" min="0" max="20" data-lg="${q.id}" data-k="insetLeftMm" value="${q.lineGrid.insetLeftMm??8}"></label>
            <label>右边距(mm)<input type="number" min="0" max="20" data-lg="${q.id}" data-k="insetRightMm" value="${q.lineGrid.insetRightMm??6}"></label>
          </div>`;
        }
        h+=`<label class="upload-button">插入图片（占位）<input type="file" accept="image/*" data-img="${q.id}"></label>`;
      }
    }
    h+=`</div>`; return h;
  }

  /* ── 状态变更 helpers ── */
  function mutateCard(fn){ const c=card(); if(c){ fn(c); } }
  function getPath(obj,path){ return path.split(".").reduce((o,k)=>o?.[k],obj); }
  function setPath(obj,path,value){ const ks=path.split("."); let o=obj; for(let i=0;i<ks.length-1;i+=1){ if(o[ks[i]]==null) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=value; }
  function setCardPath(path,value){
    const c=card(); if(!c) return;
    if(path==="paper.size"){ const size=value; setPath(c,path,size); c.paper.orientation=size==="A3"?"landscape":"portrait"; }
    else if(path==="studentInfo.studentNumberDigits"){ setPath(c,path,Math.max(1,Math.min(12,Number(value)||1))); }
    else setPath(c,path,value);
  }
  function blockField(field,value){
    const b=selectedBlock(); if(!b) return;
    if(field==="title") b.title=value;
    else if(field==="questionStart"){ b.questionStart=Number(value); b.answerKey=Grading.normalizeObjectiveAnswerKey(b); }
    else if(field==="questionCount"){ b.questionCount=Number(value); b.answerKey=Grading.normalizeObjectiveAnswerKey(b); }
    else if(field==="optionCount"){ b.optionCount=Number(value); b.questions=Grading.normalizeObjectiveQuestions(b); for(const q of b.questions) q.optionCount=b.optionCount; b.answerKey=Grading.normalizeObjectiveAnswerKey(b); }
    else if(field==="scorePerQuestion"){ b.scorePerQuestion=Number(value); }
    else if(field==="mode"){ b.mode=value; b.questions=Grading.normalizeObjectiveQuestions(b); for(const q of b.questions){ q.mode=b.mode; if(b.mode!=="multiple"&&b.mode!=="indefinite") delete q.scoringRule; } b.answerKey=Grading.normalizeObjectiveAnswerKey(b); }
    else if(field==="optionLayout"){ b.optionLayout=value; }
    else if(field==="ms1"){ b.multipleScoring=b.multipleScoring||{partialScores:{},wrongOrExtraScore:0}; b.multipleScoring.partialScores={1:Number(value)}; }
    else if(field==="msWrong"){ b.multipleScoring=b.multipleScoring||{partialScores:{},wrongOrExtraScore:0}; b.multipleScoring.wrongOrExtraScore=Number(value); }
    recompute(); rerender();
  }
  function toggleAnswer(qn,opt){
    const b=selectedBlock(); if(!b||b.type!=="objective") return;
    b.questions=Grading.normalizeObjectiveQuestions(b);
    const cfg=b.questions.find(q=>q.questionNumber===qn);
    const cur=new Set(cfg?.answerKey??b.answerKey?.[qn]??[]);
    const mode=(cfg?.mode??b.mode);
    if(mode==="single"){ if(cur.has(opt)) cur.clear(); else { cur.clear(); cur.add(opt); } }
    else { if(cur.has(opt)) cur.delete(opt); else cur.add(opt); }
    if(cfg){ cfg.answerKey=Array.from(cur).sort(); }
    if(cfg?.answerKey?.length===0) delete cfg.answerKey;
    b.answerKey=Grading.normalizeObjectiveAnswerKey(b);
    rerender();
  }
  function qConfig(qn,fn){
    const b=selectedBlock(); if(!b||b.type!=="objective") return;
    b.questions=Grading.normalizeObjectiveQuestions(b);
    const q=b.questions.find(x=>x.questionNumber===qn); if(!q) return; fn(q);
    if(q.mode==="single" && q.answerKey && q.answerKey.length>1) q.answerKey=[q.answerKey[0]];
    b.answerKey=Grading.normalizeObjectiveAnswerKey(b);
    const first=b.questions[0]; b.questionStart=first?.questionNumber??b.questionStart; b.questionCount=b.questions.length;
    recompute(); rerender();
  }
  function defaultQuestionScoringRule(){ return {type:"per_selected_count",partialScores:{},wrongOrExtraScore:0}; }
  function updateScoringRule(qn,fn){
    const b=selectedBlock(); if(!b||b.type!=="objective") return;
    qConfig(qn,q=>{ const cur=q.scoringRule??defaultQuestionScoringRule(); const cloned=JSON.parse(JSON.stringify(cur)); const result=fn(cloned); q.scoringRule=result!==undefined?result:cloned; });
  }
  function setScoringType(qn,type){
    const b=selectedBlock(); if(!b||b.type!=="objective") return;
    qConfig(qn,q=>{ const common={wrongOrExtraScore:Number(q.scoringRule?.wrongOrExtraScore??0),allowWrongOptions:q.scoringRule?.allowWrongOptions===true};
      if(type==="fixed_partial") q.scoringRule={type,partialScore:0,...common};
      else if(type==="by_correct_count") q.scoringRule={type,partialScoresByCorrectCount:{},...common};
      else q.scoringRule={type,partialScores:{},...common};
    });
  }
  function updateQuestion(fn,qid){
    const b=selectedBlock(); if(!b||b.type!=="subjective") return;
    const q=b.questions.find(x=>x.id===qid); if(q) fn(q);
    recompute(); rerender();
  }
  function qField(qid,field,value){
    updateQuestion(q=>{ if(field==="number") q.number=value; else if(field==="score") q.score=Number(value); else if(field==="minHeightMm") q.minHeightMm=Number(value); },qid);
  }
  function updateBlankQuestion(qid,fn){
    const b=selectedBlock(); if(!b||b.type!=="subjective") return;
    const q=b.questions.find(x=>x.id===qid); if(!q) return; const items=CardModel.answerBlankItems(q); fn(q);
    const first=items[0]??{label:"(1)",widthMm:32,heightMm:6};
    q.blanks={...(q.blanks??{labelStyle:"arabic_parentheses"}),count:items.length,widthMm:first.widthMm,heightMm:first.heightMm,labelStyle:q.blanks?.labelStyle??"arabic_parentheses",items};
    recompute(); rerender();
  }
  function updateBlankAnnotations(qid,idx,value){
    const b=selectedBlock(); if(!b||b.type!=="subjective") return;
    const q=b.questions.find(x=>x.id===qid); if(!q) return; const items=CardModel.answerBlankItems(q).map((it,i)=> i===idx?{...it,rightAnnotation:value||undefined}:it);
    const first=items[0]??{label:"(1)",widthMm:32,heightMm:6};
    q.blanks={...(q.blanks??{labelStyle:"arabic_parentheses"}),count:items.length,widthMm:first.widthMm,heightMm:first.heightMm,labelStyle:q.blanks?.labelStyle??"arabic_parentheses",items};
    recompute(); rerender();
  }
  function updateBlankItemsForQuestion(qid,fn){
    const b=selectedBlock(); if(!b||b.type!=="subjective") return;
    const q=b.questions.find(x=>x.id===qid); if(!q) return;
    let items=CardModel.answerBlankItems(q);
    items=fn(items);
    const first=items[0]??{label:"(1)",widthMm:32,heightMm:6};
    q.blanks={...(q.blanks??{labelStyle:"arabic_parentheses"}),count:items.length,widthMm:first.widthMm,heightMm:first.heightMm,labelStyle:q.blanks?.labelStyle??"arabic_parentheses",items};
    recompute(); rerender();
  }
  function setQKind(qid,value){
    updateQuestion(q=>{ q.kind=value; if(q.kind==="blank" && !q.blanks?.items?.length){ q.blanks=CardModel.defaultAnswerBlankQuestion(CardModel.numericQuestionValue(q.number)).blanks; } if(q.kind==="blank"){ q.style="manual_score_grid"; if(q.score<=0) q.score=12; } },qid);
  }
  function rmQuestion(qid){
    const b=selectedBlock(); if(!b||b.type!=="subjective") return;
    const isScore=b.blockKind==="fill_blank" && b.questions[0]?.id===qid;
    const score=b.questions[0]?.score??0;
    b.questions=b.questions.filter(q=>q.id!==qid);
    if(isScore && b.questions[0]){ b.questions[0].score=score; b.questions[0].style="manual_score_grid"; }
    recompute(); rerender();
  }

  /* ── 块增删移 ── */
  function addBlock(type,afterIndex){
    const c=card(); if(!c) return;
    const next=CardModel.findNextQuestionNumber(c);
    let block=null;
    if(type==="objective") block=CardModel.defaultObjective(next);
    else if(type==="subjective") block=CardModel.defaultSubjective(next);
    else if(type==="blank") block=CardModel.defaultBlankBlock(next);
    else if(type==="essay") block=CardModel.defaultEssayBlock(next);
    if(afterIndex==null) c.bodyBlocks.push(block); else c.bodyBlocks.splice(afterIndex+1,0,block);
    selectedBlockId=block.id; recompute(); rerender();
  }
  function moveBlock(id,dir){
    const c=card(); if(!c) return; const i=c.bodyBlocks.findIndex(b=>b.id===id);
    const j=i+dir; if(j<0||j>=c.bodyBlocks.length) return;
    const t=c.bodyBlocks[i]; c.bodyBlocks[i]=c.bodyBlocks[j]; c.bodyBlocks[j]=t;
    recompute(); rerender();
  }
  function removeBlock(id){
    const c=card(); if(!c) return; c.bodyBlocks=c.bodyBlocks.filter(b=>b.id!==id);
    if(selectedBlockId===id) selectedBlockId=c.bodyBlocks[0]?c.bodyBlocks[0].id:null;
    recompute(); rerender();
  }

  /* ── 工具栏动作 ── */
  function newCardAction(){ createAndEnter(); }
  function saveAction(){ recompute(); document.getElementById("statusAutosave").textContent="已保存 · "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}); document.getElementById("statusAutosave").className="ok"; toast("已在本地保存（演示）"); }
  function exportAction(){
    const c=card(); if(!c) return; const data=JSON.stringify(c,null,2);
    const blob=new Blob([data],{type:"application/json"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=(c.title||"card")+".projectx-card.json"; a.click();
    URL.revokeObjectURL(url); toast("已导出 JSON");
  }
  function importAction(file){
    const reader=new FileReader();
    reader.onload=()=>{ try{ const obj=JSON.parse(reader.result); if(!obj.bodyBlocks) throw 0; cards.push(obj); enterEditor(obj.id); toast("已导入："+obj.title); }catch{ toast("导入失败：不是有效的答题卡 JSON"); } };
    reader.readAsText(file);
  }
  let toastTimer=null;
  function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200); }

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function renderAll(){
    const c=card();
    document.getElementById("cardSub").textContent = c? `· ${esc(c.subjectLabel||"")} ${c.examDate||""}`.trim() : "";
    renderContext(); renderCanvas(); renderInspector();
  }
  function measure(){
    const canvasEl=document.getElementById("canvas");
    const pr=canvasEl.querySelector(".preview-toolbar");
    const vh = canvasEl.clientHeight - (pr?pr.offsetHeight:0) - 48;
    viewport={width:Math.max(1,canvasEl.clientWidth-48),height:Math.max(1,vh)};
  }

  let railCollapsed=false;
  function setRailCollapsed(v){
    railCollapsed=v;
    const shell=document.querySelector(".app-shell");
    shell.classList.toggle("rail-collapsed", v);
    const handle=document.getElementById("railHandle");
    if(handle){ handle.title=v?"展开侧边栏":"收起侧边栏"; handle.setAttribute("aria-label", v?"展开侧边栏":"收起侧边栏"); }
  }
  function initRailHover(){
    const rail=document.querySelector(".app-rail"), shell=document.querySelector(".app-shell");
    let collapseTimer=null;
    rail.addEventListener("mouseenter",()=>{
      if(collapseTimer){ clearTimeout(collapseTimer); collapseTimer=null; }
      if(railCollapsed) shell.classList.remove("rail-collapsed");
    });
    rail.addEventListener("mouseleave",()=>{
      if(railCollapsed){
        // 延迟收回，避免光标在手柄边界来回触发 enter/leave 造成抖动
        if(collapseTimer) clearTimeout(collapseTimer);
        collapseTimer=setTimeout(()=>{ if(railCollapsed) shell.classList.add("rail-collapsed"); },120);
      }
    });
  }

  function init(){
    seed(); recompute(); renderRail();
    initRailHover();
    const ro=new ResizeObserver(()=>{ measure(); if(screen==="editor") renderCanvas(); });
    ro.observe(document.getElementById("canvas"));
    measure();

    document.getElementById("themeToggle").onclick=()=>{
      const html=document.documentElement; const cur=html.getAttribute("data-theme");
      html.setAttribute("data-theme", cur==="dark"?"light":"dark");
    };
    document.getElementById("railHandle").onclick=()=>setRailCollapsed(!railCollapsed);
    document.getElementById("backBtn").onclick=goSelect;
    document.getElementById("newCardBtn").onclick=newCardAction;
    document.getElementById("saveBtn").onclick=saveAction;
    document.getElementById("exportBtn").onclick=exportAction;
    document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
    document.getElementById("importFile").onchange=(e)=>{ const f=e.target.files?.[0]; if(f) importAction(f); e.target.value=""; };

    document.getElementById("cardCtxMenu").querySelectorAll("[data-ctx]").forEach(n=>n.onclick=()=>{
      const menu=document.getElementById("cardCtxMenu"); const id=menu._cardId; if(!id) return;
      hideCardCtxMenu();
      const action=n.getAttribute("data-ctx");
      if(action==="open") enterEditor(id);
      else if(action==="delete"){
        if(cards.length<=1){ toast("至少保留一张答题卡"); return; }
        cards=cards.filter(c=>c.id!==id); if(activeCardId===id) activeCardId=cards[0].id; renderSelect();
      }
    });

    setScreen("select");
  }

  return { init, toast };
})();

document.addEventListener("DOMContentLoaded",()=>App.init());
</script>
</body>
</html>
